<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a">
<title>虚拟手机号生成器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
html,body{width:100%;height:100%;overflow:hidden;background:#05070d;font-family:'Segoe UI','PingFang SC',Roboto,sans-serif;user-select:none}
#splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#05070d;z-index:9999;overflow:hidden;perspective:1200px}

.bg-aurora{position:absolute;inset:-20%;background:radial-gradient(ellipse 60% 50% at 30% 20%,rgba(99,102,241,.35),transparent 60%),radial-gradient(ellipse 50% 60% at 75% 80%,rgba(168,85,247,.3),transparent 60%),radial-gradient(ellipse 40% 40% at 50% 50%,rgba(236,72,153,.2),transparent 70%);filter:blur(40px);animation:auroraMove 12s ease-in-out infinite;will-change:transform}
@keyframes auroraMove{0%,100%{transform:translate(0,0) scale(1) rotate(0)}33%{transform:translate(4%,-3%) scale(1.1) rotate(5deg)}66%{transform:translate(-3%,4%) scale(1.05) rotate(-4deg)}}

.bg-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(99,102,241,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(99,102,241,.06) 1px,transparent 1px);background-size:60px 60px;mask-image:radial-gradient(ellipse at center,#000 20%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse at center,#000 20%,transparent 75%);opacity:0;animation:fadeIn .6s .2s ease-out forwards,gridPulse 4s 1s ease-in-out infinite}
@keyframes gridPulse{0%,100%{opacity:.5;background-size:60px 60px}50%{opacity:.9;background-size:64px 64px}}

.bg-noise{position:absolute;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.35'/%3E%3C/svg%3E");opacity:.06;mix-blend-mode:overlay;pointer-events:none}

.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:20;animation:flashBurst 1.2s .4s ease-out forwards}
@keyframes flashBurst{0%{opacity:0}10%{opacity:.85}30%{opacity:.4}100%{opacity:0}}

.shockwave{position:absolute;top:50%;left:50%;width:100px;height:100px;margin:-50px 0 0 -50px;border-radius:50%;border:2px solid rgba(168,85,247,.8);opacity:0;pointer-events:none;animation:shockOut 1.6s .7s cubic-bezier(.16,1,.3,1) forwards}
.shockwave.w2{border-color:rgba(99,102,241,.6);animation:shockOut 1.8s 1s cubic-bezier(.16,1,.3,1) forwards}
.shockwave.w3{border-color:rgba(236,72,153,.5);animation:shockOut 2s 1.3s cubic-bezier(.16,1,.3,1) forwards}
@keyframes shockOut{0%{opacity:1;transform:scale(0);border-width:4px}100%{opacity:0;transform:scale(18);border-width:.5px}}

.stars{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.star{position:absolute;border-radius:50%;background:#fff;opacity:0;box-shadow:0 0 6px 1px rgba(255,255,255,.7);will-change:opacity,transform}
.meteor{position:absolute;width:120px;height:1.5px;background:linear-gradient(90deg,transparent,#fff,transparent);opacity:0;pointer-events:none;filter:drop-shadow(0 0 4px #c084fc);transform:rotate(-35deg);will-change:transform,opacity}
@keyframes meteorFly{0%{opacity:0;transform:rotate(-35deg) translateX(0)}10%{opacity:1}100%{opacity:0;transform:rotate(-35deg) translateX(-600px)}}

.orbit-wrap{position:relative;width:min(58vw,240px);height:min(58vw,240px);display:flex;align-items:center;justify-content:center;margin-bottom:5vh;transform-style:preserve-3d;will-change:transform}

.ring-wrap{position:absolute;inset:0;transform-style:preserve-3d;opacity:0;animation:ringFadeIn 1s .9s ease-out forwards}
.ring-wrap.r2{inset:8%;animation-delay:1.1s}
.ring-wrap.r3{inset:16%;animation-delay:1.3s}
@keyframes ringFadeIn{to{opacity:1}}

.ring{position:absolute;inset:0;border-radius:50%;border:1.5px solid transparent;border-top-color:rgba(129,140,248,.9);border-right-color:rgba(129,140,248,.2);will-change:transform;filter:drop-shadow(0 0 6px rgba(129,140,248,.5))}
.ring-wrap.r1 .ring{animation:spin3d 3.5s linear infinite}
.ring-wrap.r2 .ring{border-top-color:rgba(192,132,252,.9);border-right-color:rgba(192,132,252,.2);border-width:2px;animation:spin3dRev 4.5s linear infinite;filter:drop-shadow(0 0 6px rgba(192,132,252,.5))}
.ring-wrap.r3 .ring{border-top-color:rgba(244,114,182,.9);border-right-color:rgba(244,114,182,.2);animation:spin3d 5.5s linear infinite;filter:drop-shadow(0 0 6px rgba(244,114,182,.5))}
@keyframes spin3d{0%{transform:rotateX(65deg) rotateZ(0)}100%{transform:rotateX(65deg) rotateZ(360deg)}}
@keyframes spin3dRev{0%{transform:rotateX(-60deg) rotateY(30deg) rotateZ(0)}100%{transform:rotateX(-60deg) rotateY(30deg) rotateZ(-360deg)}}

.ring::after{content:'';position:absolute;top:-3px;left:50%;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:currentColor;box-shadow:0 0 12px 3px currentColor}
.ring-wrap.r1 .ring{color:#818cf8}
.ring-wrap.r2 .ring{color:#c084fc}
.ring-wrap.r3 .ring{color:#f472b6}

.core-halo{position:absolute;width:70%;height:70%;border-radius:50%;background:radial-gradient(circle,rgba(168,85,247,.5) 0%,rgba(168,85,247,0) 70%);opacity:0;animation:haloIn 1s .8s ease-out forwards,haloBreath 3s 1.8s ease-in-out infinite;will-change:transform,opacity}
@keyframes haloIn{to{opacity:1}}
@keyframes haloBreath{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.25);opacity:.4}}

.core{position:relative;width:42%;height:42%;border-radius:28%;background:linear-gradient(135deg,#6366f1 0%,#a855f7 50%,#ec4899 100%);display:flex;align-items:center;justify-content:center;font-size:clamp(30px,8.5vw,50px);box-shadow:0 0 40px rgba(99,102,241,.8),0 0 80px rgba(168,85,247,.5),inset 0 2px 12px rgba(255,255,255,.25),inset 0 -4px 12px rgba(0,0,0,.3);opacity:0;transform-style:preserve-3d;z-index:2;will-change:transform,opacity;animation:coreFlipIn 1.4s 1.4s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes coreFlipIn{0%{opacity:0;transform:rotateY(-540deg) rotateX(-30deg) scale(.2)}60%{opacity:1;transform:rotateY(20deg) rotateX(5deg) scale(1.08)}80%{transform:rotateY(-6deg) rotateX(-2deg) scale(.98)}100%{opacity:1;transform:rotateY(0) rotateX(0) scale(1)}}
.core::before{content:'';position:absolute;inset:0;border-radius:28%;background:linear-gradient(135deg,rgba(255,255,255,.35) 0%,transparent 45%,transparent 55%,rgba(0,0,0,.15) 100%);pointer-events:none}
.core-shine{position:absolute;inset:0;border-radius:28%;overflow:hidden;pointer-events:none}
.core-shine::after{content:'';position:absolute;top:-50%;left:-100%;width:80%;height:200%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-20deg);animation:shineSweep 2.5s 2.8s ease-in-out infinite}
@keyframes shineSweep{0%{left:-100%}60%,100%{left:150%}}

.spark{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:radial-gradient(circle,#fff,rgba(192,132,252,.9));opacity:0;box-shadow:0 0 12px 3px rgba(192,132,252,.9);pointer-events:none;will-change:transform,opacity}
@keyframes sparkShoot{0%{opacity:0;transform:rotate(var(--ang)) translateX(0) scale(0)}15%{opacity:1}100%{opacity:0;transform:rotate(var(--ang)) translateX(var(--dist)) scale(1.3)}}

.title-wrap{text-align:center;opacity:0;transform:translateY(24px);animation:titleIn 1s 2.5s cubic-bezier(.16,1,.3,1) forwards;padding:0 20px;position:relative}
@keyframes titleIn{to{opacity:1;transform:translateY(0)}}

.title{font-size:clamp(20px,5.8vw,30px);font-weight:900;background:linear-gradient(135deg,#a5b4fc 0%,#c084fc 40%,#f472b6 70%,#fbbf24 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:3px;margin-bottom:10px;filter:drop-shadow(0 0 24px rgba(192,132,252,.5));animation:titleGlow 3s 3.5s ease-in-out infinite}
@keyframes titleGlow{0%,100%{background-position:0% 50%;filter:drop-shadow(0 0 24px rgba(192,132,252,.5))}50%{background-position:100% 50%;filter:drop-shadow(0 0 32px rgba(244,114,182,.7))}}

.subtitle{font-size:clamp(10px,2.8vw,13px);color:#8890b5;letter-spacing:6px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:8px;opacity:0;animation:fadeIn .8s 3.2s ease-out forwards}
.subtitle .dot{width:4px;height:4px;border-radius:50%;background:#c084fc;box-shadow:0 0 6px #c084fc;animation:dotPulse 1.5s ease-in-out infinite}
.subtitle .dot:nth-child(2){animation-delay:.3s}
.subtitle .dot:nth-child(3){animation-delay:.6s}
@keyframes dotPulse{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.6);opacity:1}}
@keyframes fadeIn{to{opacity:1}}

.greeting{font-size:clamp(12px,3.2vw,15px);color:#a5b4fc;margin-top:3.5vh;opacity:0;animation:fadeIn .8s 3.6s ease-out forwards;letter-spacing:1px;text-align:center;padding:0 20px;min-height:1.4em}
.greeting .name{color:#c084fc;font-weight:700;text-shadow:0 0 12px rgba(192,132,252,.5)}

.loading-bar{width:min(60vw,220px);height:3px;background:rgba(99,102,241,.15);border-radius:3px;margin-top:4vh;overflow:hidden;opacity:0;animation:fadeIn .6s 3.9s ease-out forwards;position:relative;box-shadow:0 0 12px rgba(99,102,241,.2)}
.loading-fill{height:100%;width:0;background:linear-gradient(90deg,#6366f1,#a855f7,#ec4899,#fbbf24);background-size:200% 100%;border-radius:3px;box-shadow:0 0 14px rgba(168,85,247,.9);animation:loadFill 1.8s 4s cubic-bezier(.4,0,.2,1) forwards,shimmerMove 1.5s 4s linear infinite}
@keyframes loadFill{0%{width:0}60%{width:68%}85%{width:92%}100%{width:100%}}
@keyframes shimmerMove{0%{background-position:0% 50%}100%{background-position:200% 50%}}

.skip-btn{position:absolute;top:calc(16px + env(safe-area-inset-top));right:calc(16px + env(safe-area-inset-right));padding:8px 18px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);border-radius:40px;color:#8890b5;font-size:13px;font-weight:600;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);opacity:0;animation:fadeIn .6s 2.4s ease-out forwards;transition:all .25s;z-index:30;display:flex;align-items:center;gap:6px}
.skip-btn:hover,.skip-btn:active{background:rgba(255,255,255,.15);color:#e0e5ff;transform:scale(1.05)}
.skip-btn .progress-dot{width:6px;height:6px;border-radius:50%;background:#c084fc;box-shadow:0 0 8px #c084fc;animation:dotPulse 1.2s ease-in-out infinite}

.particle{position:absolute;border-radius:50%;pointer-events:none;opacity:0;will-change:transform,opacity}
@keyframes particleRise{0%{opacity:0;transform:translateY(0) translateX(0) scale(0)}10%{opacity:.85}90%{opacity:.2}100%{opacity:0;transform:translateY(-115vh) translateX(var(--px)) scale(1)}}
@keyframes particleOrbit{0%{opacity:0;transform:rotate(var(--startAng)) translateX(var(--radius)) scale(0)}20%{opacity:1}80%{opacity:1}100%{opacity:0;transform:rotate(calc(var(--startAng) + 360deg)) translateX(var(--radius)) scale(.5)}}
@keyframes particleBurst{0%{opacity:0;transform:rotate(var(--ang)) translateX(0) scale(0)}20%{opacity:1}100%{opacity:0;transform:rotate(var(--ang)) translateX(var(--dist)) scale(.3)}}

.exit-layer{position:fixed;inset:0;background:radial-gradient(circle at center,#fff 0%,#c084fc 30%,#0a0e1a 70%);opacity:0;pointer-events:none;z-index:10000;transform:scale(0);will-change:transform,opacity}
.exit-layer.active{animation:exitBurst .7s cubic-bezier(.4,0,.2,1) forwards}
@keyframes exitBurst{0%{opacity:0;transform:scale(0)}40%{opacity:1;transform:scale(1.2)}100%{opacity:0;transform:scale(3)}}

.core-icon{width:58%;height:58%;filter:drop-shadow(0 0 10px rgba(255,255,255,.6));animation:coreIconSpin 12s linear infinite}
@keyframes coreIconSpin{to{transform:rotate(360deg)}}

#splash.fade-out{animation:splashOut .6s cubic-bezier(.4,0,.2,1) forwards}
@keyframes splashOut{0%{opacity:1;transform:scale(1);filter:blur(0)}100%{opacity:0;transform:scale(1.15);filter:blur(8px)}}

/* 右下角 "不再显示" 勾选框 */
.no-show-toggle{
    position:absolute;
    bottom:calc(20px + env(safe-area-inset-bottom));
    right:calc(20px + env(safe-area-inset-right));
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 14px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.12);
    border-radius:40px;
    cursor:pointer;
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    opacity:0;
    animation:fadeIn .6s 4.5s ease-out forwards;
    z-index:30;
    transition:all .25s;
    user-select:none;
}
.no-show-toggle:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.22)}
.no-show-toggle input[type="checkbox"]{width:14px;height:14px;accent-color:#c084fc;cursor:pointer;margin:0}
.no-show-text{font-size:12px;color:#8890b5;font-weight:500;letter-spacing:.3px;white-space:nowrap}

@media (max-height:650px){.orbit-wrap{width:min(45vw,180px);height:min(45vw,180px);margin-bottom:3vh}.greeting{margin-top:2.5vh}.loading-bar{margin-top:2.5vh}}
@media (max-height:480px){.orbit-wrap{width:min(38vw,150px);height:min(38vw,150px);margin-bottom:2vh}.title{font-size:16px;letter-spacing:2px}.subtitle{font-size:9px;letter-spacing:4px}.greeting{margin-top:1.5vh;font-size:11px}.loading-bar{margin-top:1.5vh;width:min(50vw,180px)}.skip-btn{padding:6px 14px;font-size:11px}.no-show-toggle{padding:6px 10px}.no-show-text{font-size:11px}}
@media (max-width:360px){.no-show-text{font-size:11px}.no-show-toggle{padding:6px 10px;gap:6px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="splash">
    <div class="bg-aurora"></div>
    <div class="bg-grid"></div>
    <div class="bg-noise"></div>
    <div class="flash"></div>
    <div class="shockwave"></div>
    <div class="shockwave w2"></div>
    <div class="shockwave w3"></div>
    <div class="stars" id="stars"></div>
    <button class="skip-btn" id="skipBtn"><span class="progress-dot"></span>跳过 ›</button>
    <div class="orbit-wrap" id="orbitWrap">
        <div class="core-halo"></div>
        <div class="ring-wrap r1"><div class="ring"></div></div>
        <div class="ring-wrap r2"><div class="ring"></div></div>
        <div class="ring-wrap r3"><div class="ring"></div></div>
        <div class="core" id="core">
    <svg class="core-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <radialGradient id="g1" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
                <stop offset="100%" stop-color="#ffffff" stop-opacity="0.6"/>
            </radialGradient>
        </defs>
        <circle cx="50" cy="50" r="6" fill="url(#g1)"/>
        <circle cx="50" cy="22" r="4" fill="#fff" opacity="0.9"/>
        <circle cx="50" cy="78" r="4" fill="#fff" opacity="0.9"/>
        <circle cx="22" cy="50" r="4" fill="#fff" opacity="0.9"/>
        <circle cx="78" cy="50" r="4" fill="#fff" opacity="0.9"/>
        <circle cx="30" cy="30" r="3" fill="#fff" opacity="0.75"/>
        <circle cx="70" cy="30" r="3" fill="#fff" opacity="0.75"/>
        <circle cx="30" cy="70" r="3" fill="#fff" opacity="0.75"/>
        <circle cx="70" cy="70" r="3" fill="#fff" opacity="0.75"/>
        <circle cx="50" cy="12" r="2" fill="#fff" opacity="0.5"/>
        <circle cx="50" cy="88" r="2" fill="#fff" opacity="0.5"/>
        <circle cx="12" cy="50" r="2" fill="#fff" opacity="0.5"/>
        <circle cx="88" cy="50" r="2" fill="#fff" opacity="0.5"/>
    </svg>
    <div class="core-shine"></div>
    </div>
    <div class="title-wrap">
        <div class="title" id="splashTitle">虚拟手机号生成器</div>
        <div class="subtitle"><span class="dot"></span><span id="splashSubtitle">SAFE · SMART · SECURE</span><span class="dot"></span></div>
    </div>
    <div class="greeting" id="greeting">欢迎回来，<span class="name" id="userName">用户</span></div>
    <div class="loading-bar"><div class="loading-fill"></div></div>
    <label class="no-show-toggle" id="noShowToggle">
        <input type="checkbox" id="noShowCheckbox">
        <span class="no-show-text">不再显示开屏</span>
    </label>
</div>
<div class="exit-layer" id="exitLayer"></div>
<script>
(function(){
    'use strict';
    var splash = document.getElementById('splash');
    var exitLayer = document.getElementById('exitLayer');
    var skipBtn = document.getElementById('skipBtn');
    var orbitWrap = document.getElementById('orbitWrap');
    var starsBox = document.getElementById('stars');
    var userName = document.getElementById('userName');
    var noShowCheckbox = document.getElementById('noShowCheckbox');
    var noShowToggle = document.getElementById('noShowToggle');
    var splashTitle = document.getElementById('splashTitle');
    var splashSubtitle = document.getElementById('splashSubtitle');
    var finished = false;
    var exitTimer = null;
    var meteorTimer = null;
    var rafId = null;
    var preloadPromise = null;
    var NO_SHOW_KEY = 'splash_no_show';
    var TOTAL_DURATION = 6000;
    var isLowPerf = (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 2) || window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function readNoShow(){
        try{ return localStorage.getItem(NO_SHOW_KEY) === '1'; }catch(e){ return false; }
    }
    function writeNoShow(v){
        try{
            if(v){ localStorage.setItem(NO_SHOW_KEY,'1'); }
            else{ localStorage.removeItem(NO_SHOW_KEY); }
        }catch(e){}
    }

    if(readNoShow()){
        window.location.replace('/');
        return;
    }

    if(noShowCheckbox){
        noShowCheckbox.addEventListener('change', function(){
            writeNoShow(this.checked);
        });
    }

    function getFestivalTheme(){
        var now = new Date();
        var m = now.getMonth() + 1;
        var d = now.getDate();
        if(m === 1 && d === 1) return {title:'新年快乐', subtitle:'HAPPY NEW YEAR', colors:['#fbbf24','#ef4444','#f97316']};
        if(m === 2 && d >= 10 && d <= 17) return {title:'新春快乐', subtitle:'春节 · 团圆 · 喜庆', colors:['#ef4444','#fbbf24','#dc2626']};
        if(m === 8 && d >= 14 && d <= 16) return {title:'中秋快乐', subtitle:'但愿人长久 · 千里共婵娟', colors:['#fbbf24','#f59e0b','#fcd34d']};
        if(m === 10 && d === 1) return {title:'国庆快乐', subtitle:'祝福祖国 · 繁荣昌盛', colors:['#ef4444','#dc2626','#fbbf24']};
        if(m === 12 && d >= 24 && d <= 26) return {title:'圣诞快乐', subtitle:'MERRY CHRISTMAS', colors:['#10b981','#ef4444','#fbbf24']};
        return null;
    }

    function applyFestival(){
        var theme = getFestivalTheme();
        if(!theme) return;
        if(splashTitle) splashTitle.textContent = theme.title;
        if(splashSubtitle) splashSubtitle.textContent = theme.subtitle;
        var styleEl = document.createElement('style');
        styleEl.textContent = '.bg-aurora{background:radial-gradient(ellipse 60% 50% at 30% 20%,' + theme.colors[0] + '59,transparent 60%),radial-gradient(ellipse 50% 60% at 75% 80%,' + theme.colors[1] + '4d,transparent 60%),radial-gradient(ellipse 40% 40% at 50% 50%,' + theme.colors[2] + '33,transparent 70%)!important}.title{background:linear-gradient(135deg,' + theme.colors[0] + ' 0%,' + theme.colors[1] + ' 50%,' + theme.colors[2] + ' 100%)!important;-webkit-background-clip:text!important;background-clip:text!important;color:transparent!important}';
        document.head.appendChild(styleEl);
    }

    function createStars(){
        var count = isLowPerf ? 40 : Math.min(90, Math.floor(window.innerWidth / 11));
        var frag = document.createDocumentFragment();
        for(var i=0;i<count;i++){
            var s = document.createElement('div');
            s.className = 'star';
            var size = Math.random()*2.2+0.6;
            s.style.width = size+'px';
            s.style.height = size+'px';
            s.style.left = (Math.random()*100)+'%';
            s.style.top = (Math.random()*100)+'%';
            s.style.setProperty('--dur',(Math.random()*3+2)+'s');
            s.style.setProperty('--delay',(Math.random()*4)+'s');
            s.style.setProperty('--op',(Math.random()*0.7+0.3).toFixed(2));
            s.style.animation = 'starTwinkle var(--dur) ease-in-out infinite';
            s.style.animationDelay = 'var(--delay)';
            frag.appendChild(s);
        }
        starsBox.appendChild(frag);
        var styleEl = document.createElement('style');
        styleEl.textContent = '@keyframes starTwinkle{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:var(--op);transform:scale(1)}}';
        document.head.appendChild(styleEl);
    }

    function createParticles(){
        var riseCount = isLowPerf ? 10 : Math.min(20, Math.floor(window.innerWidth/25));
        var frag = document.createDocumentFragment();
        for(var i=0;i<riseCount;i++){
            var p = document.createElement('div');
            p.className = 'particle';
            var size = Math.random()*4+2;
            p.style.width = size+'px';
            p.style.height = size+'px';
            p.style.left = (Math.random()*100)+'%';
            p.style.bottom = (Math.random()*20-10)+'%';
            var color = ['#818cf8','#c084fc','#f472b6','#60a5fa','#fbbf24'][Math.floor(Math.random()*5)];
            p.style.background = color;
            p.style.boxShadow = '0 0 8px 1px '+color;
            p.style.setProperty('--pdelay',(Math.random()*6)+'s');
            p.style.setProperty('--px',(Math.random()*80-40)+'px');
            p.style.animation = 'particleRise '+(Math.random()*8+12)+'s linear infinite';
            p.style.animationDelay = 'var(--pdelay)';
            frag.appendChild(p);
        }
        splash.appendChild(frag);
    }

    function createOrbitParticles(){
        if(isLowPerf) return;
        var count = 12;
        for(var i=0;i<count;i++){
            var p = document.createElement('div');
            p.className = 'particle';
            var size = Math.random()*3+2;
            p.style.width = size+'px';
            p.style.height = size+'px';
            p.style.left = '50%';
            p.style.top = '50%';
            var color = ['#818cf8','#c084fc','#f472b6'][Math.floor(Math.random()*3)];
            p.style.background = color;
            p.style.boxShadow = '0 0 8px 1px '+color;
            p.style.setProperty('--startAng',(Math.random()*360)+'deg');
            p.style.setProperty('--radius',(Math.random()*40+90)+'px');
            p.style.animation = 'particleOrbit '+(Math.random()*4+6)+'s linear infinite';
            p.style.animationDelay = (Math.random()*2+1.5)+'s';
            p.style.marginLeft = (-size/2)+'px';
            p.style.marginTop = (-size/2)+'px';
            orbitWrap.appendChild(p);
        }
    }

    function createSparks(){
        var count = isLowPerf ? 6 : 12;
        for(var i=0;i<count;i++){
            var sp = document.createElement('div');
            sp.className = 'spark';
            var ang = (i/count)*360;
            sp.style.setProperty('--ang',ang+'deg');
            sp.style.setProperty('--dist',(Math.random()*70+90)+'px');
            sp.style.animation = 'sparkShoot '+(Math.random()*1.5+1.5)+'s ease-out infinite';
            sp.style.animationDelay = (2.8 + Math.random()*2)+'s';
            orbitWrap.appendChild(sp);
        }
    }

    function createMeteor(){
        if(isLowPerf) return;
        var m = document.createElement('div');
        m.className = 'meteor';
        m.style.left = (Math.random()*80+60)+'%';
        m.style.top = (Math.random()*50)+'%';
        m.style.animation = 'meteorFly '+(Math.random()*1.5+1.5)+'s ease-out forwards';
        starsBox.appendChild(m);
        setTimeout(function(){ if(m.parentNode) m.parentNode.removeChild(m); }, 3500);
    }

    function scheduleMeteors(){
        if(isLowPerf) return;
        if(Math.random() < 0.6){
            createMeteor();
        }
        meteorTimer = setTimeout(scheduleMeteors, Math.random()*2000+1500);
    }

    function getCachedUser(){
        try{ return localStorage.getItem('splash_user'); }catch(e){ return null; }
    }

    function preloadDashboard(){
        if(preloadPromise) return preloadPromise;
        preloadPromise = Promise.all([
            fetch('/api/check-auth',{credentials:'include',headers:{'Accept':'application/json'}}).then(function(r){return r.json()}).catch(function(){return null}),
            fetch('/api/attendance-info',{credentials:'include',headers:{'Accept':'application/json'}}).then(function(r){return r.json()}).catch(function(){return null}),
            fetch('/api/get-points',{credentials:'include',headers:{'Accept':'application/json'}}).then(function(r){return r.json()}).catch(function(){return null}),
            fetch('/api/mail/list',{credentials:'include',headers:{'Accept':'application/json'}}).then(function(r){return r.json()}).catch(function(){return null})
        ]).then(function(results){
            try{
                var cache = {
                    auth: results[0],
                    attendance: results[1],
                    points: results[2],
                    mail: results[3],
                    ts: Date.now()
                };
                sessionStorage.setItem('splash_preload', JSON.stringify(cache));
            }catch(e){}
            return results;
        });
        return preloadPromise;
    }

    function loadUser(){
        var cached = getCachedUser();
        if(cached) userName.textContent = cached;
        fetch('/api/check-auth',{credentials:'include'}).then(function(r){return r.json()}).then(function(d){
            if(d && d.authenticated && d.username){
                userName.textContent = d.username;
                try{ localStorage.setItem('splash_user', d.username); }catch(e){}
            }
        }).catch(function(){});
    }

    function markShown(){
        try{
            fetch('/api/csrf-token',{credentials:'include'}).then(function(r){return r.json()}).then(function(d){
                var token = d && d.csrf_token;
                return fetch('/api/user/splash-shown',{
                    method:'POST',
                    credentials:'include',
                    headers:{'Content-Type':'application/json','X-CSRF-Token':token||''},
                    body:'{}'
                });
            }).catch(function(){});
        }catch(e){}
    }

    function stopAll(){
        if(exitTimer){ clearTimeout(exitTimer); exitTimer = null; }
        if(meteorTimer){ clearTimeout(meteorTimer); meteorTimer = null; }
        if(rafId){ cancelAnimationFrame(rafId); rafId = null; }
    }

    function goToMain(){
        if(finished) return;
        finished = true;
        stopAll();
        try{ markShown(); }catch(e){}
        exitLayer.classList.add('active');
        splash.classList.add('fade-out');
        var nav = function(){
            window.location.replace('/');
        };
        if(preloadPromise){
            Promise.race([preloadPromise, new Promise(function(r){setTimeout(r,800)})]).then(function(){
                setTimeout(nav, 680);
            });
        } else {
            setTimeout(nav, 680);
        }
    }

    function skip(){ goToMain(); }

    skipBtn.addEventListener('click', function(e){
        e.stopPropagation();
        skip();
    });
    document.addEventListener('keydown', function(e){
        if(e.key === 'Escape' || e.key === 'Enter' || e.key === ' ') skip();
    });

    var clickCount = 0;
    var clickTimer = null;
    splash.addEventListener('click', function(e){
        if(e.target === skipBtn || e.target === noShowCheckbox) return;
        if(noShowToggle && noShowToggle.contains(e.target)) return;
        clickCount++;
        if(clickCount >= 2){
            clearTimeout(clickTimer);
            clickCount = 0;
            skip();
            return;
        }
        clearTimeout(clickTimer);
        clickTimer = setTimeout(function(){ clickCount = 0; }, 400);
    });

    var mx = 0, my = 0, tx = 0, ty = 0;
    if(!isLowPerf && window.matchMedia('(pointer:fine)').matches){
        document.addEventListener('mousemove', function(e){
            var w = window.innerWidth, h = window.innerHeight;
            tx = (e.clientX / w - 0.5) * 2;
            ty = (e.clientY / h - 0.5) * 2;
        });
        var startTime = performance.now();
        function parallaxLoop(now){
            if(finished) return;
            mx += (tx - mx) * 0.08;
            my += (ty - my) * 0.08;
            var t = (now - startTime) / 1000;
            var rotateY = mx * 8;
            var rotateX = -my * 8;
            var floatY = Math.sin(t * 1.2) * 6;
            orbitWrap.style.transform = 'rotateY('+rotateY+'deg) rotateX('+rotateX+'deg) translateY('+floatY+'px)';
            rafId = requestAnimationFrame(parallaxLoop);
        }
        setTimeout(function(){ rafId = requestAnimationFrame(parallaxLoop); }, 2000);
    }

    applyFestival();
    createStars();
    createParticles();
    createOrbitParticles();
    setTimeout(createSparks, 2400);
    setTimeout(scheduleMeteors, 1200);
    loadUser();
    preloadDashboard();

    exitTimer = setTimeout(goToMain, TOTAL_DURATION);
})();
</script>
</body>
</html>
