<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>意见反馈 - 虚拟手机号生成器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(160deg, #fff7ed 0%, #ffedd5 40%, #fed7aa 100%);
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            top: -30%;
            right: -20%;
            width: 70%;
            height: 70%;
            background: radial-gradient(circle, rgba(251,146,60,0.18), transparent 70%);
            pointer-events: none;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -30%;
            left: -20%;
            width: 70%;
            height: 70%;
            background: radial-gradient(circle, rgba(249,115,22,0.12), transparent 70%);
            pointer-events: none;
        }
        .container {
            max-width: 720px;
            width: 100%;
            background: rgba(255,255,255,0.96);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 32px;
            box-shadow: 0 30px 80px rgba(194,65,12,0.18), 0 0 0 1px rgba(255,255,255,0.8) inset;
            overflow: hidden;
            margin: 20px 0;
            position: relative;
            z-index: 1;
        }
        .header {
            background: linear-gradient(135deg, #fb923c 0%, #f97316 50%, #ea580c 100%);
            padding: 40px 40px 34px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -20%;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(255,255,255,0.2), transparent 70%);
            border-radius: 50%;
        }
        .header .icon {
            font-size: 52px;
            display: block;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.15));
        }
        .header h1 {
            color: #fff;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 1px;
            position: relative;
            z-index: 1;
        }
        .header p {
            color: rgba(255,255,255,0.9);
            font-size: 14px;
            margin-top: 8px;
            position: relative;
            z-index: 1;
            font-weight: 500;
        }
        .tabs {
            display: flex;
            background: #fff7ed;
            border-bottom: 1px solid #fed7aa;
        }
        .tab-btn {
            flex: 1;
            padding: 18px 12px;
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            color: #c2410c;
            transition: all 0.25s;
            position: relative;
            font-family: inherit;
            letter-spacing: 0.3px;
        }
        .tab-btn:hover {
            color: #ea580c;
            background: rgba(251,146,60,0.08);
        }
        .tab-btn.active {
            color: #ea580c;
            background: #fff;
        }
        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 20%;
            right: 20%;
            height: 3px;
            background: linear-gradient(90deg, #fb923c, #ea580c);
            border-radius: 3px 3px 0 0;
        }
        .content {
            padding: 38px 40px 34px;
        }
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }
        .form-group { margin-bottom: 24px; }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            color: #7c2d12;
            margin-bottom: 10px;
            letter-spacing: 0.2px;
        }
        .form-group label .required {
            color: #ea580c;
            margin-left: 3px;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 14px 18px;
            font-size: 14px;
            font-family: inherit;
            color: #7c2d12;
            background: #fffbf5;
            border: 2px solid #fed7aa;
            border-radius: 16px;
            outline: none;
            transition: all 0.25s;
            font-weight: 500;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #fb923c;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(251,146,60,0.15);
        }
        .form-group input[readonly] {
            background: #fef3e2;
            color: #b45309;
            cursor: not-allowed;
        }
        .form-group textarea {
            min-height: 150px;
            resize: vertical;
            line-height: 1.6;
        }
        .char-count {
            text-align: right;
            font-size: 12px;
            color: #b45309;
            margin-top: 8px;
            font-weight: 600;
        }
        .char-count.warning { color: #f59e0b; }
        .char-count.danger { color: #ea580c; }
        .submit-btn {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            font-weight: 800;
            color: #fff;
            background: linear-gradient(135deg, #fb923c 0%, #ea580c 100%);
            border: none;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.25s;
            letter-spacing: 1px;
            box-shadow: 0 10px 28px rgba(234,88,12,0.3);
        }
        .submit-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 16px 38px rgba(234,88,12,0.4);
        }
        .submit-btn:active:not(:disabled) { transform: translateY(0); }
        .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; box-shadow: none; }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #b45309;
            text-decoration: none;
            transition: color 0.2s;
            font-weight: 600;
        }
        .back-link:hover { color: #ea580c; text-decoration: underline; }
        .toast {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(-120px);
            background: #7c2d12;
            color: #fff;
            padding: 15px 30px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 700;
            box-shadow: 0 16px 40px rgba(124,45,18,0.35);
            transition: transform 0.3s cubic-bezier(0.16,1,0.3,1);
            z-index: 9999;
            max-width: 90%;
            text-align: center;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.success { background: linear-gradient(135deg, #fb923c, #ea580c); }
        .toast.error { background: linear-gradient(135deg, #dc2626, #b91c1c); }
        .result-box {
            display: none;
            background: linear-gradient(135deg, #fff7ed, #ffedd5);
            border: 2px solid #fb923c;
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 24px;
            text-align: center;
        }
        .result-box.show { display: block; }
        .result-box .result-icon {
            font-size: 44px;
            margin-bottom: 10px;
        }
        .result-box .result-title {
            font-size: 17px;
            font-weight: 800;
            color: #c2410c;
            margin-bottom: 8px;
        }
        .result-box .result-id {
            font-family: 'SF Mono', monospace;
            font-size: 15px;
            color: #ea580c;
            font-weight: 800;
            background: #fff;
            padding: 10px 18px;
            border-radius: 12px;
            display: inline-block;
            margin-top: 10px;
            border: 1px solid #fed7aa;
            box-shadow: 0 4px 12px rgba(251,146,60,0.15);
        }
        .feedback-list-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 12px;
            flex-wrap: wrap;
        }
        .feedback-list-toolbar .title {
            font-size: 15px;
            font-weight: 800;
            color: #7c2d12;
        }
        .refresh-btn {
            padding: 9px 18px;
            font-size: 13px;
            font-weight: 700;
            color: #ea580c;
            background: #fff7ed;
            border: 1px solid #fed7aa;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .refresh-btn:hover:not(:disabled) { background: #ffedd5; }
        .refresh-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .feedback-item {
            background: #fffbf5;
            border: 1px solid #fed7aa;
            border-radius: 18px;
            padding: 20px 22px;
            margin-bottom: 16px;
            transition: all 0.25s;
        }
        .feedback-item:hover {
            border-color: #fb923c;
            box-shadow: 0 8px 24px rgba(251,146,60,0.12);
            transform: translateY(-2px);
        }
        .feedback-item .fi-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            gap: 10px;
            flex-wrap: wrap;
        }
        .feedback-item .fi-id {
            font-family: 'SF Mono', monospace;
            font-size: 12px;
            color: #ea580c;
            font-weight: 800;
            background: #fff;
            padding: 4px 12px;
            border-radius: 8px;
            border: 1px solid #fed7aa;
        }
        .feedback-item .fi-status {
            font-size: 12px;
            font-weight: 800;
            padding: 4px 14px;
            border-radius: 20px;
        }
        .feedback-item .fi-status.pending {
            background: #fff7ed;
            color: #ea580c;
            border: 1px solid #fed7aa;
        }
        .feedback-item .fi-status.replied {
            background: #ecfdf5;
            color: #047857;
            border: 1px solid #a7f3d0;
        }
        .feedback-item .fi-status.closed {
            background: #f5f5f4;
            color: #78716c;
            border: 1px solid #e7e5e4;
        }
        .feedback-item .fi-meta {
            display: flex;
            gap: 14px;
            font-size: 12px;
            color: #b45309;
            margin-bottom: 12px;
            flex-wrap: wrap;
            font-weight: 600;
        }
        .feedback-item .fi-content {
            font-size: 14px;
            color: #7c2d12;
            line-height: 1.7;
            white-space: pre-wrap;
            word-break: break-word;
            padding: 14px 16px;
            background: #fff;
            border-radius: 12px;
            border-left: 4px solid #fb923c;
            font-weight: 500;
        }
        .reply-box {
            margin-top: 14px;
            padding: 16px 18px;
            background: linear-gradient(135deg, #ecfdf5, #d1fae5);
            border-radius: 14px;
            border-left: 4px solid #10b981;
        }
        .reply-box .reply-label {
            font-size: 12px;
            font-weight: 800;
            color: #047857;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .reply-box .reply-text {
            font-size: 14px;
            color: #064e3b;
            line-height: 1.7;
            white-space: pre-wrap;
            word-break: break-word;
            font-weight: 500;
        }
        .list-empty, .list-loading {
            text-align: center;
            padding: 56px 20px;
            color: #b45309;
            font-size: 14px;
            font-weight: 600;
        }
        .list-empty .emoji {
            font-size: 48px;
            display: block;
            margin-bottom: 14px;
        }
        .list-loading .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid #fed7aa;
            border-top-color: #fb923c;
            border-radius: 50%;
            margin: 0 auto 14px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 24px;
            flex-wrap: wrap;
        }
        .pagination button {
            min-width: 40px;
            padding: 8px 14px;
            background: #fff7ed;
            border: 1px solid #fed7aa;
            border-radius: 10px;
            color: #ea580c;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            transition: all 0.2s;
            font-family: inherit;
        }
        .pagination button:hover:not(:disabled) { background: #ffedd5; }
        .pagination button.active {
            background: linear-gradient(135deg, #fb923c, #ea580c);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 6px 16px rgba(234,88,12,0.3);
        }
        .pagination button:disabled { opacity: 0.4; cursor: not-allowed; }
        @media (max-width: 480px) {
            body { padding: 16px 10px; }
            .header { padding: 30px 20px 26px; }
            .header .icon { font-size: 40px; }
            .header h1 { font-size: 22px; }
            .content { padding: 24px 20px; }
            .tab-btn { font-size: 13px; padding: 15px 8px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <span class="icon">💬</span>
            <h1>意见反馈</h1>
            <p>您的建议是我们前进的动力</p>
        </div>

        <div class="tabs">
            <button class="tab-btn active" data-tab="submit">提交反馈</button>
            <button class="tab-btn" data-tab="list">我的反馈</button>
        </div>

        <div class="content">
            <div id="submitPanel" class="tab-panel active">
                <div class="result-box" id="resultBox">
                    <div class="result-icon">✅</div>
                    <div class="result-title">反馈提交成功</div>
                    <div>您的反馈编号为：</div>
                    <div class="result-id" id="resultId">-</div>
                </div>

                <form id="feedbackForm">
                    <div class="form-group">
                        <label>用户名</label>
                        <input type="text" id="username" readonly>
                    </div>
                    <div class="form-group">
                        <label>联系邮箱</label>
                        <input type="text" id="email" readonly>
                    </div>
                    <div class="form-group">
                        <label>反馈类型<span class="required">*</span></label>
                        <select id="feedbackType" required>
                            <option value="">请选择反馈类型</option>
                            <option value="功能建议">功能建议</option>
                            <option value="问题反馈">问题反馈</option>
                            <option value="体验优化">体验优化</option>
                            <option value="内容举报">内容举报</option>
                            <option value="其他">其他</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>反馈内容<span class="required">*</span></label>
                        <textarea id="content" placeholder="请详细描述您遇到的问题或建议（5-2000字）..." maxlength="2000"></textarea>
                        <div class="char-count" id="charCount">0 / 2000</div>
                    </div>
                    <button type="submit" class="submit-btn" id="submitBtn">提交反馈</button>
                    <a href="/" class="back-link">← 返回首页</a>
                </form>
            </div>

            <div id="listPanel" class="tab-panel">
                <div class="feedback-list-toolbar">
                    <div class="title">我的反馈记录 <span style="font-size:12px;font-weight:500;color:#b45309;">（已回复/已关闭的反馈将在12小时后自动清除）</span></div>
                    <button class="refresh-btn" id="refreshListBtn">🔄 刷新</button>
                </div>
                <div id="feedbackListContainer">
                    <div class="list-loading">
                        <div class="spinner"></div>
                        加载中...
                    </div>
                </div>
                <div class="pagination" id="feedbackPagination"></div>
                <a href="/" class="back-link">← 返回首页</a>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        let csrfToken = '';
        let currentPage = 1;
        let totalPages = 1;

        const STATUS_MAP = {
            pending: { text: '待处理', cls: 'pending' },
            replied: { text: '已回复', cls: 'replied' },
            closed: { text: '已关闭', cls: 'closed' }
        };

        function showToast(message, type) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + (type || '');
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function escapeHtml(text) {
            if (text === null || text === undefined) return '';
            const div = document.createElement('div');
            div.textContent = String(text);
            return div.innerHTML;
        }

        function formatTime(ts) {
            if (!ts) return '-';
            try {
                const d = new Date(ts);
                const pad = n => String(n).padStart(2, '0');
                return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
            } catch (e) {
                return '-';
            }
        }

        async function fetchCsrfToken() {
            try {
                const res = await fetch('/api/csrf-token', { credentials: 'include' });
                const data = await res.json();
                csrfToken = data.csrf_token;
            } catch (e) {
                console.error('CSRF token fetch failed', e);
            }
        }

        async function loadUserInfo() {
            try {
                const res = await fetch('/api/check-auth', { credentials: 'include' });
                const data = await res.json();
                if (!data.authenticated) {
                    window.location.href = '/login.html';
                    return;
                }
                document.getElementById('username').value = data.username || '';
                document.getElementById('email').value = data.email || '';
            } catch (e) {
                console.error('Load user info failed', e);
                window.location.href = '/login.html';
            }
        }

        async function loadFeedbackList(page) {
            page = page || 1;
            currentPage = page;
            const container = document.getElementById('feedbackListContainer');
            const pagination = document.getElementById('feedbackPagination');
            container.innerHTML = '<div class="list-loading"><div class="spinner"></div>加载中...</div>';
            pagination.innerHTML = '';

            try {
                const res = await fetch(`/api/feedback/list?page=${page}&per_page=10`, {
                    credentials: 'include'
                });
                const data = await res.json();

                if (!res.ok) {
                    container.innerHTML = `<div class="list-empty"><span class="emoji">⚠️</span>${escapeHtml(data.error || '加载失败')}</div>`;
                    return;
                }

                if (!data.feedbacks || data.feedbacks.length === 0) {
                    container.innerHTML = '<div class="list-empty"><span class="emoji">📭</span>暂无反馈记录<br><span style="font-size:13px;color:#d97706;margin-top:8px;display:inline-block;">提交反馈后可在此查看进度</span></div>';
                    return;
                }

                totalPages = data.total_pages || 1;

                let html = '';
                data.feedbacks.forEach(fb => {
                    const statusInfo = STATUS_MAP[fb.status] || STATUS_MAP.pending;
                    const replyHtml = (fb.status === 'replied' || fb.status === 'closed') && fb.reply
                        ? `<div class="reply-box">
                               <div class="reply-label">💬 管理员回复</div>
                               <div class="reply-text">${escapeHtml(fb.reply)}</div>
                           </div>`
                        : '';

                    html += `
                        <div class="feedback-item">
                            <div class="fi-header">
                                <span class="fi-id">${escapeHtml(fb.feedback_id)}</span>
                                <span class="fi-status ${statusInfo.cls}">${statusInfo.text}</span>
                            </div>
                            <div class="fi-meta">
                                <span>📂 ${escapeHtml(fb.feedback_type || '未分类')}</span>
                                <span>🕐 ${formatTime(fb.created_at)}</span>
                            </div>
                            <div class="fi-content">${escapeHtml(fb.content)}</div>
                            ${replyHtml}
                        </div>
                    `;
                });
                container.innerHTML = html;

                if (totalPages > 1) {
                    let pgHtml = '';
                    pgHtml += `<button ${page <= 1 ? 'disabled' : ''} data-page="${page - 1}">‹ 上一页</button>`;
                    const startPage = Math.max(1, page - 2);
                    const endPage = Math.min(totalPages, page + 2);
                    for (let i = startPage; i <= endPage; i++) {
                        pgHtml += `<button class="${i === page ? 'active' : ''}" data-page="${i}">${i}</button>`;
                    }
                    pgHtml += `<button ${page >= totalPages ? 'disabled' : ''} data-page="${page + 1}">下一页 ›</button>`;
                    pagination.innerHTML = pgHtml;
                    pagination.querySelectorAll('button[data-page]').forEach(btn => {
                        btn.addEventListener('click', () => {
                            const p = parseInt(btn.getAttribute('data-page'), 10);
                            if (p >= 1 && p <= totalPages && p !== currentPage) {
                                loadFeedbackList(p);
                            }
                        });
                    });
                }
            } catch (e) {
                console.error(e);
                container.innerHTML = '<div class="list-empty"><span class="emoji">⚠️</span>网络错误，请稍后重试</div>';
            }
        }

        const contentInput = document.getElementById('content');
        const charCount = document.getElementById('charCount');
        contentInput.addEventListener('input', () => {
            const len = contentInput.value.length;
            charCount.textContent = len + ' / 2000';
            charCount.className = 'char-count';
            if (len > 1800) charCount.classList.add('danger');
            else if (len > 1500) charCount.classList.add('warning');
        });

        document.getElementById('feedbackForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const feedbackType = document.getElementById('feedbackType').value;
            const content = contentInput.value.trim();

            if (!feedbackType) {
                showToast('请选择反馈类型', 'error');
                return;
            }
            if (content.length < 5) {
                showToast('反馈内容至少5个字符', 'error');
                return;
            }

            btn.disabled = true;
            btn.textContent = '提交中...';

            try {
                const res = await fetch('/api/feedback/submit', {
                    method: 'POST',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-Token': csrfToken
                    },
                    body: JSON.stringify({
                        feedback_type: feedbackType,
                        content: content
                    })
                });
                const data = await res.json();

                if (res.ok && data.success) {
                    document.getElementById('resultId').textContent = data.feedback_id;
                    document.getElementById('resultBox').classList.add('show');
                    document.getElementById('feedbackForm').style.display = 'none';
                    showToast(data.message, 'success');
                    contentInput.value = '';
                    charCount.textContent = '0 / 2000';
                    charCount.className = 'char-count';
                } else {
                    showToast(data.error || '提交失败，请重试', 'error');
                }
            } catch (err) {
                console.error(err);
                showToast('网络错误，请稍后重试', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = '提交反馈';
            }
        });

        document.getElementById('refreshListBtn').addEventListener('click', function () {
            this.disabled = true;
            loadFeedbackList(currentPage).finally(() => {
                this.disabled = false;
            });
        });

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
                btn.classList.add('active');
                const tab = btn.getAttribute('data-tab');
                document.getElementById(tab + 'Panel').classList.add('active');
                if (tab === 'list') {
                    loadFeedbackList(1);
                }
            });
        });

        (async () => {
            await fetchCsrfToken();
            await loadUserInfo();
        })();
    </script>
</body>
</html>
