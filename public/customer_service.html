<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能客服</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI','PingFang SC',sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
        .container{background:rgba(255,255,255,0.98);border-radius:32px;box-shadow:0 25px 50px -12px rgba(0,0,0,0.25);width:100%;max-width:600px;height:85vh;display:flex;flex-direction:column;overflow:hidden;animation:slideUp 0.5s ease-out}
        @keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
        .header{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;padding:20px 24px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
        .header h2{font-size:20px;display:flex;align-items:center;gap:10px}
        .header h2 span{font-size:14px;font-weight:400;opacity:0.8}
        .header .close-btn{background:rgba(255,255,255,0.2);border:none;color:#fff;width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:18px;transition:all 0.3s;display:flex;align-items:center;justify-content:center}
        .header .close-btn:hover{background:rgba(255,255,255,0.3);transform:rotate(90deg)}
        .chat-area{flex:1;overflow-y:auto;padding:20px 24px;background:#f8f9fa;display:flex;flex-direction:column;gap:12px}
        .chat-area::-webkit-scrollbar{width:4px}
        .chat-area::-webkit-scrollbar-thumb{background:#667eea;border-radius:10px}
        .message{max-width:88%;padding:12px 16px;border-radius:16px;animation:msgIn 0.3s ease-out;word-wrap:break-word;line-height:1.8;font-size:14px}
        @keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
        .message.user{align-self:flex-end;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border-bottom-right-radius:4px}
        .message.bot{align-self:flex-start;background:#fff;color:#333;border-bottom-left-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,0.06);max-width:92%}
        .message.bot .title{font-weight:700;color:#667eea;margin-bottom:6px;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
        .message.bot .title .engine-tag{font-size:11px;font-weight:400;background:#e8f0fe;color:#667eea;padding:2px 10px;border-radius:12px;margin-left:8px}
        .message.bot .content{color:#444;line-height:1.9}
        .message.bot .content .highlight{color:#667eea;font-weight:600}
        .message.bot .content .status-yes{color:#27ae60;font-weight:600}
        .message.bot .content .status-no{color:#e74c3c;font-weight:600}
        .message.bot .content .news-image{max-width:100%;border-radius:12px;margin-top:8px;border:1px solid #e8e8e8}
        .message.bot .content .search-result{background:#f8f9fa;border-radius:12px;padding:12px 16px;border-left:4px solid #667eea;margin-top:6px}
        .message.bot .content .search-result .result-title{font-weight:600;color:#1a0dab;margin-bottom:4px;font-size:15px}
        .message.bot .content .search-result .result-desc{color:#545454;font-size:13px;line-height:1.6;margin-bottom:4px}
        .message.bot .content .search-result .result-url{color:#006621;font-size:12px;word-break:break-all}
        .message.bot .content .search-result .result-url a{color:#006621;text-decoration:none;word-break:break-all}
        .message.bot .content .search-result .result-url a:hover{text-decoration:underline}
        .message.bot .content .weather-card{background:linear-gradient(135deg,#667eea15,#764ba215);border-radius:16px;padding:16px 20px;margin-top:6px;border:1px solid rgba(102,126,234,0.2)}
        .message.bot .content .weather-card .weather-city{font-size:20px;font-weight:700;color:#333;margin-bottom:4px}
        .message.bot .content .weather-card .weather-city .city-icon{font-size:22px}
        .message.bot .content .weather-card .weather-update{font-size:11px;color:#999;margin-bottom:8px}
        .message.bot .content .weather-card .weather-main{display:flex;align-items:center;gap:20px;padding:8px 0;border-bottom:1px solid #f0f0f0}
        .message.bot .content .weather-card .weather-main .temp{font-size:42px;font-weight:700;color:#667eea}
        .message.bot .content .weather-card .weather-main .condition{font-size:16px;color:#666}
        .message.bot .content .weather-card .weather-main .condition .sub-temp{font-size:14px;color:#999;font-weight:400}
        .message.bot .content .weather-card .weather-details{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 0;border-bottom:1px solid #f0f0f0}
        .message.bot .content .weather-card .weather-details .item{text-align:center}

        .message.bot .content .weather-card .weather-details .item .value{font-size:14px;font-weight:600;color:#333}
        .message.bot .content .weather-card .weather-hourly{display:flex;gap:6px;padding:8px 0;overflow-x:auto;border-bottom:1px solid #f0f0f0}
        .message.bot .content .weather-card .weather-hourly .hour-item{flex:1;min-width:40px;text-align:center;background:#f8f9fa;border-radius:6px;padding:4px 2px}
        .message.bot .content .weather-card .weather-hourly .hour-item .hour-time{font-size:10px;color:#999}
        .message.bot .content .weather-card .weather-hourly .hour-item .hour-temp{font-size:14px;font-weight:600;color:#333}
        .message.bot .content .weather-card .weather-hourly .hour-item .hour-rain{font-size:9px;color:#4a90d9;line-height:1.4}
        .message.bot .content .weather-card .weather-forecast{display:flex;gap:6px;padding:8px 0;overflow-x:auto}

        .message.bot .content .weather-card .weather-alert{background:#fef2f2;border-left:4px solid #e74c3c;padding:8px 12px;margin-top:8px;border-radius:4px;font-size:12px;color:#c0392b}
        .message.bot .content .time-card{background:linear-gradient(135deg,#667eea25,#764ba225);border-radius:16px;padding:16px 20px;margin-top:6px;border:1px solid rgba(102,126,234,0.2)}
        .message.bot .content .time-card .time-city{font-size:20px;font-weight:700;color:#333;margin-bottom:4px}

        .message.bot .content .cancellation-card .suggestion-btn{display:inline-block;padding:8px 20px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;margin-top:8px;transition:all 0.3s}

        .message.bot .content .cancellation-card .detail-box{background:#f8f9fa;padding:8px 12px;border-radius:8px;margin:6px 0;font-size:13px;color:#666;white-space:pre-wrap}
        .message.bot .content .cdk-card{background:#f0f4ff;border-radius:16px;padding:16px 20px;margin-top:6px;border-left:4px solid #f39c12}
        .message.bot .content .cdk-card .cdk-item{background:#fff;border-radius:10px;padding:10px 14px;margin-bottom:8px;border:1px solid #e8e8e8}

        .message.bot .content .cdk-card .cdk-item .cdk-req{font-size:11px;color:#999;margin:2px 0}
        .message.bot .matched-tag{display:inline-block;font-size:10px;background:#e8f0fe;color:#667eea;padding:2px 10px;border-radius:12px;margin-top:6px}
        .message.bot .suggestions{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
        .message.bot .suggestions .sug{background:#f0f0f0;padding:4px 14px;border-radius:20px;font-size:12px;cursor:pointer;transition:all 0.2s;color:#666}
        .message.bot .suggestions .sug:hover{background:#667eea;color:#fff;transform:scale(1.05)}
        .message.bot .data-card{background:#f8f9fa;border-radius:12px;padding:12px 16px;margin-top:8px;border-left:4px solid #667eea}
        .message.bot .data-card .row{display:flex;justify-content:space-between;padding:4px 0;font-size:13px;border-bottom:1px solid #f0f0f0}
        .message.bot .data-card .row:last-child{border-bottom:none}
        .message.bot .data-card .row .label{color:#888}
        .message.bot .data-card .row .value{font-weight:600;color:#333;text-align:right}
        .message.bot .data-card .row .value.milestone{font-size:12px;color:#667eea;font-weight:500}
        .typing-indicator{align-self:flex-start;background:#fff;padding:12px 20px;border-radius:16px;border-bottom-left-radius:4px;display:flex;gap:4px;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
        .typing-indicator .dot{width:8px;height:8px;background:#667eea;border-radius:50%;animation:bounce 1.4s infinite}
        .typing-indicator .dot:nth-child(2){animation-delay:0.2s}
        .typing-indicator .dot:nth-child(3){animation-delay:0.4s}
        @keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
        .input-area{display:flex;gap:12px;padding:16px 24px;background:#fff;border-top:1px solid #eee;flex-shrink:0}
        .input-area input{flex:1;padding:12px 18px;border:2px solid #e0e0e0;border-radius:60px;font-size:15px;outline:none;transition:all 0.3s}
        .input-area input:focus{border-color:#667eea;box-shadow:0 0 0 3px rgba(102,126,234,0.1)}
        .input-area button{padding:12px 28px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:60px;font-size:15px;font-weight:600;cursor:pointer;transition:all 0.3s;white-space:nowrap}
        .input-area button:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 4px 12px rgba(102,126,234,0.3)}
        .input-area button:disabled{opacity:0.5;cursor:not-allowed;transform:none}
        .quick-questions{display:flex;gap:8px;padding:8px 24px 16px;flex-wrap:wrap;background:#fff;flex-shrink:0;border-top:1px solid #f0f0f0}
        .quick-questions .quick-btn{padding:6px 16px;border:1px solid #e0e0e0;border-radius:20px;background:#fafafa;font-size:12px;color:#666;cursor:pointer;transition:all 0.2s}
        .quick-questions .quick-btn:hover{border-color:#667eea;color:#667eea;background:#f0f4ff}
        .welcome-msg{text-align:center;color:#999;font-size:14px;padding:30px 0;line-height:2.2}
        .welcome-msg .icon{font-size:48px;display:block;margin-bottom:12px}
        .welcome-msg .highlight{color:#667eea;font-weight:600}
        .welcome-msg .examples{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
        .welcome-msg .examples .ex{padding:4px 14px;background:#f0f0f0;border-radius:20px;font-size:13px;color:#666;cursor:pointer;transition:all 0.2s}
        .welcome-msg .examples .ex:hover{background:#667eea;color:#fff}
        .note-text{text-align:center;font-size:12px;color:#667eea;padding:8px 12px;margin:4px 0;cursor:pointer;background:#f0f4ff;border-radius:20px;border:1px solid rgba(102,126,234,0.2);transition:all 0.3s;display:inline-block;align-self:center}
        .note-text:hover{background:#667eea;color:#fff;border-color:#667eea;transform:scale(1.02)}
        .note-text .arrow{display:inline-block;transition:transform 0.3s}
        .note-text:hover .arrow{transform:translateX(4px)}
        .knowledge-divider{margin:12px 0 8px 0;border-top:1px dashed #e0e0e0}
        .search-tag{display:inline-block;font-size:10px;background:#e8f0fe;color:#667eea;padding:2px 10px;border-radius:12px;margin-top:6px}
        @media(max-width:600px){.container{height:100vh;border-radius:0;max-width:100%}.header{padding:16px 20px}.chat-area{padding:16px}.input-area{padding:12px 16px}.quick-questions{padding:8px 16px 12px}.message{max-width:92%}.message.bot .content .weather-card .weather-details{grid-template-columns:1fr 1fr}.message.bot .content .time-card .time-details{grid-template-columns:1fr 1fr}.message.bot .content .time-card .time-main{flex-direction:column;text-align:center;gap:8px}}
    </style>
</head>
<body>
    <div class="container">
        <div class="header">

            <div class="welcome-msg" id="welcomeMsg">

                输入你的问题，我会从知识库中查找答案<br>
                输入「搜索+内容」自动获取搜索结果<br>

                    <span class="ex" onclick="sendQuick('北京天气')">🌤️ 搜索天气</span>

        </div>
        <div class="quick-questions">
            <span class="quick-btn" onclick="sendQuick('今日签到')">📅 今日签到</span>
            <span class="quick-btn" onclick="sendQuick('积分余额')">⭐ 积分余额</span>
            <span class="quick-btn" onclick="sendQuick('PL余额')">💎 PL余额</span>
            <span class="quick-btn" onclick="sendQuick('CDK')">🎫 查询CDK</span>
            <span class="quick-btn" onclick="sendQuick('注销卡密')">🗑️ 注销卡密</span>

    <script>
        var csrfToken = null;
        var csrfTokenLastFetch = 0;
        var currentUser = null;
        var pendingExtraResults = null;

        function goHome() {
            window.location.href = '/';
        }

        function getCsrfTokenFromCookie() {
            try {
                var cookies = document.cookie.split(';');
                for (var i = 0; i < cookies.length; i++) {
                    var cookie = cookies[i].trim();
                    if (cookie.indexOf('csrf_token=') === 0) {
                        return cookie.substring('csrf_token='.length, cookie.length);
                    }
                }
                return null;
            } catch (e) { return null; }
        }

        async function fetchCsrfToken() {
            if (csrfToken && (Date.now() - csrfTokenLastFetch) < 300000) {
                return csrfToken;
            }
            var cookieToken = getCsrfTokenFromCookie();
            if (cookieToken) {
                csrfToken = cookieToken;
                csrfTokenLastFetch = Date.now();
                return csrfToken;
            }
            try {
                var res = await fetch('/api/csrf-token', {
                    method: 'GET',
                    credentials: 'include',
                    headers: { 'Accept': 'application/json' }
                });
                var data = await res.json();
                if (data.csrf_token) {
                    csrfToken = data.csrf_token;
                    csrfTokenLastFetch = Date.now();
                    return csrfToken;
                }
                throw new Error('No CSRF token');
            } catch (e) {
                throw new Error('Failed to fetch CSRF token');
            }
        }

        async function apiRequest(url, options) {
            if (!options) options = {};
            options.credentials = 'include';
            if (!options.headers) options.headers = {};
            options.headers['Content-Type'] = 'application/json';
            options.headers['Accept'] = 'application/json';
            var method = (options.method || 'GET').toUpperCase();
            if (method === 'GET' || method === 'HEAD') {
                var res = await fetch(url, options);
                var data = await res.json();
                if (!res.ok) {
                    throw new Error(data.error || '请求失败: ' + res.status);
                }
                return data;
            }
            var token = await fetchCsrfToken();
            options.headers['X-CSRF-Token'] = token;
            var res = await fetch(url, options);
            var data = await res.json();
            if (!res.ok) {
                if (res.status === 403 && data.error && data.error.includes('CSRF')) {
                    csrfToken = null;
                    var newToken = await fetchCsrfToken();
                    options.headers['X-CSRF-Token'] = newToken;
                    var retryRes = await fetch(url, options);
                    var retryData = await retryRes.json();
                    if (!retryRes.ok) {
                        throw new Error(retryData.error || '请求失败: ' + retryRes.status);
                    }
                    return retryData;
                }
                throw new Error(data.error || '请求失败: ' + res.status);
            }
            return data;
        }

        var chatArea = document.getElementById('chatArea');
        var msgInput = document.getElementById('msgInput');
        var sendBtn = document.getElementById('sendBtn');
        var welcomeMsg = document.getElementById('welcomeMsg');

        function formatContent(content) {
            var formatted = content;
            formatted = formatted.replace(/\n\n/g, '\n');
            formatted = formatted.replace(/\n/g, '<br>');
            formatted = formatted.replace(/<br>(\d+\.)/g, '<br>$1');
            formatted = formatted.replace(/<br>- /g, '<br>&nbsp;&nbsp;- ');
            return formatted;
        }

        function getConsecutiveRewardDesc(day) {
            var base = day % 30;
            if (base === 0 || base === 30) return '高级积分卡密 ×3 + 积分加成卡 ×2 + 重置密码卡密 ×1';
            if (base === 29) return '高级积分卡密 ×3 + 积分加成卡 ×2 + 重置密码卡密 ×1';
            if (base === 14) return '高级积分卡密 ×3';
            if (base === 6) return '高级积分卡密 ×2';
            if (base === 4) return '高级积分卡密 ×1';
            return '无';
        }

        function getTotalRewardDesc(day) {
            var base = day % 30;
            if (base === 0 || base === 30) return '8.8积分 + 积分加成卡 ×1';
            if (base === 28) return '8.8积分 + 积分加成卡 ×1';
            if (base === 15) return '3.0积分';
            if (base === 7) return '1.8积分';
            if (base === 3) return '1.0积分';
            if (day >= 99 && base === 9) return '38.0积分 + 积分加成卡 ×3';
            if (day >= 59 && base === 29) return '20.0积分 + 积分加成卡 ×2';
            return '无';
        }

        function buildAttendanceCard(data) {
            var att = data.attendance;
            var statusText = att.has_attended_today ? '✅ 已签到' : '❌ 未签到';
            var statusClass = att.has_attended_today ? 'status-yes' : 'status-no';
            var rewardText = att.consecutive_rewards && att.consecutive_rewards.length > 0 && att.consecutive_rewards[0] !== '无' 
                ? att.consecutive_rewards.join('、') 
                : '无';
            var totalRewardText = att.total_rewards && att.total_rewards.length > 0 && att.total_rewards[0] !== '无' 
                ? att.total_rewards.join('、') 
                : '无';
            var milestoneText = '';
            if (att.next_consecutive_milestone) {
                var m = att.next_consecutive_milestone;
                var cycle = Math.ceil(m / 30);
                var rewardDesc = getConsecutiveRewardDesc(m);

        function formatWeatherDate(dateStr) {
            try {
                if (!dateStr) return '--';
                var d = new Date(dateStr);
                if (isNaN(d.getTime())) return dateStr;
                var today = new Date();
                var tomorrow = new Date(today);
                tomorrow.setDate(tomorrow.getDate() + 1);
                if (d.toDateString() === today.toDateString()) return '今天';
                if (d.toDateString() === tomorrow.toDateString()) return '明天';
                var weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
                return weekdays[d.getDay()];
            } catch (e) {
                return dateStr || '--';
            }
        }

        function addMessage(role, content, extra) {
            if (welcomeMsg) welcomeMsg.style.display = 'none';
            var div = document.createElement('div');
            div.className = 'message ' + role;
            if (role === 'bot') {
                if (extra && extra.title) {
                    var titleSpan = document.createElement('div');
                    titleSpan.className = 'title';
                    var titleHtml = extra.title;
                    if (extra.engine) {
                        titleHtml += ' <span class="engine-tag">📍 ' + extra.engine + '</span>';
                    }
                    titleSpan.innerHTML = titleHtml;
                    div.appendChild(titleSpan);
                }
                var contentDiv = document.createElement('div');
                contentDiv.className = 'content';
                
                if (extra && extra.time_data) {
                    contentDiv.innerHTML = buildTimeCard(extra);
                } else if (extra && extra.weather_data) {
                    contentDiv.innerHTML = buildWeatherCard(extra);
                } else if (extra && extra.cancellation_data) {
                    contentDiv.innerHTML = buildCancellationCard(extra.cancellation_data);
                } else if (extra && extra.cdk_data) {
                    contentDiv.innerHTML = buildCdkCard(extra.cdk_data);
                } else if (extra && extra.user_data) {
                    var html = '';
                    var hasPersonalData = false;
                    if (extra.user_data.attendance) {
                        html += buildAttendanceCard(extra.user_data);
                        hasPersonalData = true;
                    }
                    if (extra.user_data.points) {
                        if (hasPersonalData) html += '<br>';
                        html += buildPointsCard(extra.user_data);
                        hasPersonalData = true;
                    }
                    if (extra.user_data.pl) {
                        if (hasPersonalData) html += '<br>';
                        html += buildPlCard(extra.user_data);
                        hasPersonalData = true;
                    }
                    if (extra.knowledge_content && !extra.is_personal_query) {
                        if (html) html += '<div class="knowledge-divider"></div>';
                        html += '📖 相关说明:<br>' + formatContent(extra.knowledge_content);
                    } else if (extra.knowledge_content) {
                        html += '<div class="knowledge-divider"></div>';
                        html += '📖 ' + formatContent(extra.knowledge_content);
                    }
                    contentDiv.innerHTML = html;
                } else if (extra && extra.search_data) {
                    contentDiv.innerHTML = buildSearchResult(extra.search_data);
                } else {
                    contentDiv.innerHTML = formatContent(content);
                }
                div.appendChild(contentDiv);
                
                if (extra && extra.matched_keywords && extra.matched_keywords.length > 0 && !extra.is_personal_query && !extra.search_data && !extra.weather_data && !extra.time_data && !extra.cancellation_data && !extra.cdk_data) {

            }

            chatArea.scrollTop = chatArea.scrollHeight;
            return div;
        }

                var userData = data.user_data || {};
                var hasPersonalData = Object.keys(userData).length > 0;
                
                if (data.found && data.results && data.results.length > 0) {
                    var firstResult = data.results[0];
                    
                    if (hasPersonalData) {
                        addMessage('bot', '', {
                            title: '📊 个人数据',
                            user_data: userData,
                            knowledge_content: firstResult.content,
                            is_personal_query: true,
                            matched_keywords: firstResult.matched_keywords || []
                        });
                    } else {
                        addMessage('bot', firstResult.content, {
                            title: '📚 ' + firstResult.title,
                            matched_keywords: firstResult.matched_keywords || []
                        });
                    }
                    
                    if (data.results.length > 1) {
                        pendingExtraResults = data.results.slice(1);
                        var note = document.createElement('div');
                        note.className = 'note-text';
                        note.innerHTML = '📚 还有 ' + (data.results.length - 1) + ' 条相关内容 <span class="arrow">→</span>';
                        note.onclick = showMoreResults;
                        chatArea.appendChild(note);
                        chatArea.scrollTop = chatArea.scrollHeight;
                    }
                } else {
                    addMessage('bot', '没有找到相关内容，试试输入「搜索+内容」进行网页搜索', {
                        title: '😅 未找到匹配结果',
                        suggestions: ['今日签到', '积分余额', 'PL余额', '新闻', '搜索天气', '美国时间', '查询CDK', '注销卡密']
                    });
                }
            } catch (error) {
                removeTypingIndicator();
                addMessage('bot', error.message || '服务暂时不可用，请稍后重试', {
                    title: '❌ 请求失败'
                });
            }
            sendBtn.disabled = false;
            msgInput.focus();
        }

        document.addEventListener('DOMContentLoaded', async function() {
            try {
                await fetchCsrfToken();
                var authData = await apiRequest('/api/check-auth');
                if (authData.authenticated) {
                    currentUser = authData.username;
                }
            } catch (e) {
                console.warn('Auth check failed:', e);
            }
            msgInput.focus();
        });
    </script>
</body>
</html>
