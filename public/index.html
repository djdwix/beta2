<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>虚拟手机号生成器 - 主控台</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h2>📱 虚拟手机号生成器</h2>
                <div class="user-info" id="userInfo"></div>
            </div>
            <div class="points-display">
                <span>⭐ 总积分: <span id="totalPoints">0</span></span>
                <span>📅 今日已获: <span id="dailyEarnedPoints">0</span>/14</span>
                <span id="boostIndicator" style="display:none;">⚡ 加成中 <span id="boostTimer">0:00</span></span>
                <a href="/mail.html" class="mail-link" id="mailLink" style="position:relative;">📬 邮箱 <span id="mailBadge" style="display:none;position:absolute;top:-6px;right:-8px;background:#e74c3c;color:white;border-radius:50%;padding:0 6px;font-size:11px;font-weight:bold;">0</span></a>
                <a href="/pool.html" class="mall-link" style="background:rgba(255,255,255,0.2);border-radius:20px;padding:4px 12px;color:white;text-decoration:none;font-size:13px;">🏊 瓜分池</a>
                <a href="/fund.html" class="mall-link" style="background:rgba(255,255,255,0.2);border-radius:20px;padding:4px 12px;color:white;text-decoration:none;font-size:13px;">🏦 理财</a>
                <a href="/gateway.html" class="mall-link">🎁 积分商城</a>
                <a href="/calendar.html" class="mall-link" style="background:rgba(255,255,255,0.2);border-radius:20px;padding:4px 12px;color:white;text-decoration:none;font-size:13px;">📅 日历</a>
                <a href="/player_center.html" class="mall-link">👤 玩家中心</a>
                <a href="/GAME/" class="nav-btn" style="background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#1a1a2e;">
    <i class="fas fa-gamepad"></i> 游戏中心
</a>
                <a href="/customer_service.html" class="mall-link" style="background:rgba(255,255,255,0.2);border-radius:20px;padding:4px 12px;color:white;text-decoration:none;font-size:13px;">💬 客服</a>
            </div>
            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                <a href="https://discord.gg/vzT54nKnt" target="_blank" class="discord-link" style="background: #5865F2; color: white; padding: 8px 16px; border-radius: 40px; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; font-size: 14px;"><i class="fab fa-discord"></i> Discord</a>
                <button id="cancellationBtn" class="logout-btn" style="background: rgba(231, 76, 60, 0.8);">🗑️ 注销账号</button>
                <button id="logoutBtn" class="logout-btn">🚪 退出登录</button>
            </div>
        </div>

        <div id="identityWarning" class="identity-warning" style="display:none;">
            <div>
                <strong>⚠️ 身份认证未完成</strong>
                <span>完成身份认证后可使用全部功能</span>
            </div>
            <a href="/identity_verification.html" class="identity-warning-btn">立即认证</a>
        </div>

        <div id="announcementSection" class="announcement-section" style="display:none;">
            <div class="announcement-header">
                <span><i class="fas fa-bullhorn"></i> 系统公告</span>
                <button id="toggleAnnouncementBtn" class="toggle-announcement-btn"><i class="fas fa-chevron-up"></i></button>
            </div>
            <div id="announcementList" class="announcement-list"></div>
        </div>

        <div id="mainContent" style="display:none;">
            <div class="attendance-section">
                <div class="attendance-info">
                    <span>📅 累计签到: <span id="attendanceTotalDays">0</span>天</span>
                    <span>🔥 连续签到: <span id="attendanceConsecutiveDays">0</span>天</span>
                    <span>📊 今日积分: <span id="attendanceDailyEarned">0</span>/14</span>
                </div>
                <div id="attendanceBtnWrapper" style="display:flex;">
                    <button id="attendanceBtn" class="attendance-btn">✅ 每日签到 (+0.3积分)</button>
                </div>
            </div>

            <div id="dailyBonusSection" class="daily-bonus-section" style="display:none;">
                <div>
                    <strong>🎉 恭喜！</strong> 您昨日达到了14积分上限
                    <span style="font-size:12px; color:#666;">（已发送至邮箱）</span>
                </div>
                <button id="claimDailyBonusBtn" class="claim-bonus-btn">📬 前往邮箱领取</button>
            </div>

            <div class="phone-generator">
                <button id="generateBtn" class="generate-btn">✨ 生成手机号</button>
                <div id="cooldownTimer" class="cooldown-timer"></div>
                <div id="phoneDisplay" class="phone-display">
                    <span class="placeholder">点击生成获取号码</span>
                </div>
            </div>
            <div class="auth-code-section">
                <div class="section-header">
                    <h3>📜 授权码记录</h3>
                    <span class="record-count" id="recordCount">0</span>
                </div>
                <div id="recordsList" class="records-list">
                    <div class="empty-state">暂无授权码记录</div>
                </div>
                <div class="verify-section">
                    <div class="verify-input-wrapper">
                        <input type="text" id="authCodeInput" class="auth-code-input" placeholder="输入授权码（仅限大写字母+数字）" maxlength="8" autocomplete="off">
                        <button id="verifyBtn" disabled>🔓 验证并回填获取积分</button>
                    </div>
                </div>
                <div id="fullPhoneDisplay" class="full-phone-display" style="display:none;"></div>
                <button id="copyFullPhoneBtn" class="copy-full-btn" style="display:none;">📋 复制完整号码</button>
            </div>
        </div>
    </div>

    <div id="attendanceRewardModal" class="modal" style="display:none;">
        <div class="modal-content">
            <h3>🎁 签到奖励</h3>
            <div id="rewardList"></div>
            <button onclick="document.getElementById('attendanceRewardModal').style.display='none'">确定</button>
        </div>
    </div>

    <div id="cancellationModal" class="modal" style="display:none;">
        <div class="modal-content" style="max-width: 540px;">
            <h3 style="color: #e74c3c; margin-bottom: 16px;">🗑️ 注销账号</h3>
            <p style="color: #e74c3c; font-size: 13px; margin-bottom: 20px; background: #fef2f2; padding: 10px; border-radius: 8px;">⚠️ 警告：注销后所有数据将被永久删除，无法恢复！</p>

            <div style="display:flex; gap:8px; margin-bottom:16px; background:#f0f0f0; padding:4px; border-radius:60px;">
                <button id="cancelTabCard" class="cancel-tab-btn active" style="flex:1; padding:10px; border:none; background:linear-gradient(135deg,#667eea,#764ba2); color:white; border-radius:60px; font-size:14px; font-weight:600; cursor:pointer;">🔑 卡密注销</button>
                <button id="cancelTabEmail" class="cancel-tab-btn" style="flex:1; padding:10px; border:none; background:transparent; color:#666; border-radius:60px; font-size:14px; font-weight:600; cursor:pointer;">📧 邮箱验证注销</button>
            </div>

            <div id="cancelCardMethod">
                <div style="margin-bottom:20px;">
                    <label style="display: block; margin-bottom: 8px; font-size: 14px; font-weight: 500; color: #333;">绑定邮箱</label>
                    <input type="email" id="cancelCardEmail" placeholder="请输入绑定邮箱" style="width:100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 12px; font-size: 14px;">
                </div>
                <div style="margin-bottom:20px;">
                    <label style="display: block; margin-bottom: 8px; font-size: 14px; font-weight: 500; color: #333;">登录密码</label>
                    <input type="password" id="cancelCardPassword" placeholder="请输入登录密码" style="width:100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 12px; font-size: 14px;">
                </div>
                <div style="margin-bottom:20px;">
                    <label style="display: block; margin-bottom: 8px; font-size: 14px; font-weight: 500; color: #333;">注销卡密</label>
                    <input type="text" id="cancelCardCode" placeholder="格式: XXXX-XXXX-XXXX-XXXX" style="width:100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 12px; font-size: 14px; font-family: monospace;">
                </div>
            </div>

            <div id="cancelEmailMethod" style="display:none;">
                <div style="margin-bottom:20px;">
                    <label style="display: block; margin-bottom: 8px; font-size: 14px; font-weight: 500; color: #333;">绑定邮箱</label>
                    <input type="email" id="cancelEmailInput" placeholder="请输入绑定邮箱" style="width:100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 12px; font-size: 14px;">
                </div>
                <div style="margin-bottom:20px;">
                    <label style="display: block; margin-bottom: 8px; font-size: 14px; font-weight: 500; color: #333;">邮箱验证码</label>
                    <div style="display: flex; gap: 12px;">
                        <input type="text" id="cancelEmailCode" placeholder="请输入6位验证码" maxlength="6" style="flex:1; padding: 12px; border: 2px solid #e0e0e0; border-radius: 12px; font-size: 14px; text-align: center; letter-spacing: 4px; font-family: monospace;">
                        <button id="sendCancelEmailCodeBtn" style="padding: 12px 20px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap;">发送验证码</button>
                    </div>
                    <div id="cancelEmailCountdown" style="font-size: 12px; color: #999; margin-top: 4px;"></div>
                </div>
            </div>

            <div style="background: #fef2f2; border-radius: 12px; padding: 12px; margin-bottom: 24px; border-left: 4px solid #e74c3c;">
                <div style="display: flex; align-items: flex-start; gap: 10px;">
                    <input type="checkbox" id="promiseCheckbox" style="margin-top: 2px; width: 18px; height: 18px; cursor: pointer;">
                    <label for="promiseCheckbox" style="font-size: 12px; color: #666; line-height: 1.5; cursor: pointer;">我已阅读并同意：<br>1. 注销后所有个人数据将被永久删除<br>2. 注销后账号无法恢复，所有积分和卡密将清零<br>3. 确认无未使用的卡密和积分</label>
                </div>
            </div>

            <div style="display: flex; gap: 12px;">
                <button id="confirmCancellationBtn" style="flex: 1; padding: 12px; background: #e74c3c; color: white; border: none; border-radius: 40px; font-size: 16px; font-weight: 600; cursor: pointer;">确认注销</button>
                <button id="closeCancellationModal" style="flex: 1; padding: 12px; background: #999; color: white; border: none; border-radius: 40px; font-size: 16px; font-weight: 600; cursor: pointer;">取消</button>
            </div>
            <div id="cancellationMessage" style="margin-top: 16px; font-size: 13px; text-align: center;"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
