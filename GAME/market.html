<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>📈 卡牌交易市场</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        body{font-family:'Segoe UI','PingFang SC',sans-serif;background:linear-gradient(135deg,#0a0a1a 0%,#1a1a3e 50%,#0d0d2b 100%);min-height:100vh;color:#e8e8f0;padding:20px;touch-action:manipulation}
        .container{max-width:1200px;margin:0 auto}
        .header{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;background:rgba(255,255,255,0.06);border-radius:20px;border:1px solid rgba(255,255,255,0.08);margin-bottom:24px;flex-wrap:wrap;gap:12px}
        .header h1{font-size:24px;background:linear-gradient(135deg,#fbbf24,#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        .header .right-group{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
        .header .gcoin-badge{background:linear-gradient(135deg,#fbbf24,#d97706);color:#1a1a2e;padding:6px 16px;border-radius:20px;font-weight:700;font-size:14px}
        .header .back-btn{padding:8px 20px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.1);border-radius:40px;color:#d1d5db;cursor:pointer;transition:all 0.3s;font-size:13px;text-decoration:none;min-height:40px;display:flex;align-items:center}
        .header .back-btn:hover{background:rgba(255,255,255,0.15)}
        .tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
        .tab{padding:10px 24px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:40px;color:rgba(255,255,255,0.6);cursor:pointer;transition:all 0.3s;font-size:14px;font-weight:500;min-height:44px;display:flex;align-items:center}
        .tab:hover{background:rgba(255,255,255,0.08)}
        .tab.active{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border-color:transparent}
        .tab-content{display:none}
        .tab-content.active{display:block}
        .section{background:rgba(255,255,255,0.04);border-radius:20px;padding:24px;border:1px solid rgba(255,255,255,0.06);margin-bottom:20px}
        .section-title{font-size:18px;font-weight:700;color:#fff;margin-bottom:16px;display:flex;align-items:center;gap:10px}
        .filter-bar{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
        .filter-bar input,.filter-bar select{padding:10px 16px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);border-radius:12px;color:#fff;font-size:14px;outline:none;min-height:44px}
        .filter-bar input{flex:1;min-width:180px}
        .filter-bar input:focus,.filter-bar select:focus{border-color:#667eea}
        .filter-bar select option{background:#1a1a2e;color:#fff}
        .listing-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
        .listing-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:16px;transition:all 0.3s;display:flex;flex-direction:column;gap:10px}
        .listing-card:hover{background:rgba(255,255,255,0.08);transform:translateY(-3px);box-shadow:0 8px 25px rgba(0,0,0,0.3)}
        .listing-card.common{border-color:rgba(156,163,175,0.4)}
        .listing-card.rare{border-color:rgba(96,165,250,0.5);background:rgba(96,165,250,0.06)}
        .listing-card.epic{border-color:rgba(167,139,250,0.6);background:rgba(167,139,250,0.08)}
        .listing-card.legendary{border-color:rgba(251,191,36,0.7);background:rgba(251,191,36,0.1);box-shadow:0 0 20px rgba(251,191,36,0.2)}
        .listing-header{display:flex;align-items:center;gap:10px}
        .listing-emoji{font-size:36px}
        .listing-info{flex:1;min-width:0}
        .listing-name{font-size:15px;font-weight:600;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .listing-rarity{font-size:11px;font-weight:700;margin-top:2px}
        .listing-seller{font-size:12px;color:rgba(255,255,255,0.4);margin-top:2px}
        .listing-price{display:flex;justify-content:space-between;align-items:center;padding-top:10px;border-top:1px solid rgba(255,255,255,0.06)}
        .listing-price-text{font-size:18px;font-weight:700;color:#fbbf24}
        .listing-quantity{font-size:12px;color:rgba(255,255,255,0.5)}
        .btn-buy{width:100%;padding:10px;background:linear-gradient(135deg,#fbbf24,#d97706);border:none;border-radius:40px;color:#1a1a2e;font-weight:700;font-size:14px;cursor:pointer;transition:all 0.3s;min-height:44px}
        .btn-buy:hover{transform:scale(1.03);box-shadow:0 8px 25px rgba(251,191,36,0.4)}
        .btn-buy:disabled{opacity:0.5;cursor:not-allowed;transform:none}
        .btn-cancel{width:100%;padding:10px;background:rgba(248,113,113,0.15);border:1px solid rgba(248,113,113,0.3);border-radius:40px;color:#f87171;font-weight:600;font-size:14px;cursor:pointer;transition:all 0.3s;min-height:44px}
        .btn-cancel:hover{background:rgba(248,113,113,0.25)}
        .btn{display:inline-block;padding:10px 28px;border:none;border-radius:40px;font-size:14px;font-weight:600;cursor:pointer;transition:all 0.3s;min-height:44px;text-decoration:none}
        .btn-primary{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
        .btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(102,126,234,0.3)}
        .btn-success{background:linear-gradient(135deg,#34d399,#059669);color:#fff}
        .btn-success:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(52,211,153,0.3)}
        .btn-outline{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:#d1d5db}
        .btn-outline:hover{background:rgba(255,255,255,0.12)}
        .btn:disabled{opacity:0.5;cursor:not-allowed;transform:none}
        .form-row{display:flex;gap:14px;margin-bottom:16px;flex-wrap:wrap;align-items:flex-end}
        .form-group{flex:1;min-width:160px}
        .form-group label{display:block;margin-bottom:6px;font-size:12px;color:rgba(255,255,255,0.5);font-weight:500}
        .form-group input,.form-group select{width:100%;padding:10px 14px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);border-radius:12px;color:#fff;font-size:14px;outline:none;transition:all 0.25s;min-height:44px}
        .form-group input:focus,.form-group select:focus{border-color:#667eea}
        .form-group select option{background:#1a1a2e;color:#fff}
        .card-picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;max-height:300px;overflow-y:auto;padding:8px;background:rgba(0,0,0,0.2);border-radius:12px}
        .card-pick-item{background:rgba(255,255,255,0.04);border:2px solid rgba(255,255,255,0.08);border-radius:10px;padding:8px;text-align:center;cursor:pointer;transition:all 0.2s}
        .card-pick-item:hover{background:rgba(255,255,255,0.1)}
        .card-pick-item.selected{border-color:#fbbf24;background:rgba(251,191,36,0.15)}
        .card-pick-item .cp-emoji{font-size:28px;display:block;margin-bottom:4px}
        .card-pick-item .cp-name{font-size:11px;color:#fff;font-weight:500}
        .card-pick-item .cp-count{font-size:10px;color:#34d399;font-weight:600}
        .empty-state{text-align:center;padding:60px 20px;color:rgba(255,255,255,0.3)}
        .empty-state .icon{font-size:48px;display:block;margin-bottom:12px}
        .loading{text-align:center;padding:40px;color:rgba(255,255,255,0.3)}
        .loading .spinner{width:40px;height:40px;border:3px solid rgba(255,255,255,0.1);border-top-color:#fbbf24;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px}
        @keyframes spin{to{transform:rotate(360deg)}}
        .message{position:fixed;bottom:24px;right:24px;padding:14px 24px;border-radius:16px;z-index:9999;animation:slideUp 0.35s ease;max-width:420px;box-shadow:0 12px 40px rgba(0,0,0,0.5);font-size:14px;display:flex;align-items:center;gap:10px}
        .message-success{background:#065f46;color:#a7f3d0;border:1px solid rgba(52,211,153,0.2)}
        .message-error{background:#7f1d1d;color:#fca5a5;border:1px solid rgba(239,68,68,0.2)}
        .message-warning{background:#78350f;color:#fde68a;border:1px solid rgba(251,191,36,0.2)}
        @keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
        .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);display:none;align-items:center;justify-content:center;z-index:10000;padding:20px}
        .modal-overlay.active{display:flex}
        .modal-box{background:linear-gradient(145deg,#1a1a3e,#0d0d2b);border-radius:20px;padding:28px;border:1px solid rgba(255,255,255,0.1);max-width:500px;width:100%;animation:modalIn 0.3s ease}
        @keyframes modalIn{from{transform:scale(0.9);opacity:0}to{transform:scale(1);opacity:1}}
        .modal-box h3{font-size:20px;color:#fff;font-weight:700;margin-bottom:16px;text-align:center}
        .modal-box .modal-info{background:rgba(255,255,255,0.04);border-radius:12px;padding:16px;margin-bottom:16px}
        .modal-box .modal-info .info-row{display:flex;justify-content:space-between;margin-bottom:8px;font-size:14px}
        .modal-box .modal-info .info-row:last-child{margin-bottom:0}
        .modal-box .modal-info .info-row .label{color:rgba(255,255,255,0.5)}
        .modal-box .modal-info .info-row .value{color:#fff;font-weight:600}
        .modal-box .modal-info .info-row .value.gold{color:#fbbf24}
        .modal-box .modal-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
        .modal-box .modal-actions button{padding:12px 28px;border:none;border-radius:40px;font-size:14px;font-weight:600;cursor:pointer;transition:all 0.3s;min-height:44px}
        .modal-box .modal-actions .btn-cancel-modal{background:rgba(255,255,255,0.08);color:#d1d5db}
        .modal-box .modal-actions .btn-confirm{background:linear-gradient(135deg,#fbbf24,#d97706);color:#1a1a2e}
        .page-info{text-align:center;padding:20px;color:rgba(255,255,255,0.5);font-size:14px}
        .pagination{display:flex;justify-content:center;gap:6px;margin-top:20px;flex-wrap:wrap}
        .pagination button{padding:6px 14px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.06);border-radius:8px;color:rgba(255,255,255,0.5);cursor:pointer;font-size:12px;transition:all 0.2s;min-height:36px}
        .pagination button:hover{background:rgba(255,255,255,0.08)}
        .pagination button.active{background:rgba(102,126,234,0.2);color:#a78bfa;border-color:rgba(102,126,234,0.2)}
        @media(max-width:768px){
            body{padding:12px}
            .header{padding:12px 16px}
            .header h1{font-size:20px}
            .section{padding:16px}
            .listing-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
            .listing-card{padding:12px}
            .listing-emoji{font-size:30px}
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📈 卡牌交易市场</h1>
        <div class="right-group">
            <div class="gcoin-badge">🪙 <span id="gcoinBalance">0</span> G币</div>
            <a href="/GAME/" class="back-btn">← 返回游戏大厅</a>
        </div>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('market', event)">🛒 交易市场</div>
        <div class="tab" onclick="switchTab('mine', event)">📦 我的挂单</div>
        <div class="tab" onclick="switchTab('sell', event)">💰 出售卡牌</div>
        <div class="tab" onclick="switchTab('exchange', event)">🔄 积分兑换</div>
    </div>

    <div class="tab-content active" id="tab-market">
        <div class="section">
            <div class="section-title">🛒 市场挂单</div>
            <div class="filter-bar">
                <input type="text" id="marketSearch" placeholder="搜索卡牌名称或卖家...">
                <select id="marketGameFilter">
                    <option value="">全部游戏</option>
                    <option value="dice">🎲 骰子大战</option>
                    <option value="blackjack">🃏 二十一点</option>
                    <option value="guess_number">🎯 猜数字</option>
                    <option value="rock_paper_scissors">🤖 石头剪刀布</option>
                    <option value="roulette">🎡 轮盘赌</option>
                    <option value="lucky_wheel">🎰 幸运转盘</option>
                    <option value="memory_cards">🧠 记忆翻牌</option>
                    <option value="whack_mole">🔨 打地鼠</option>
                    <option value="dice_royale">👑 骰子王者</option>
                    <option value="blackjack_tournament">🏆 21点锦标赛</option>
                    <option value="treasure_hunt">💎 寻宝迷宫</option>
                    <option value="boss_battle">⚔️ 挑战BOSS</option>
                </select>
                <select id="marketRarityFilter">
                    <option value="">全部稀有度</option>
                    <option value="common">普通</option>
                    <option value="rare">稀有</option>
                    <option value="epic">史诗</option>
                    <option value="legendary">传说</option>
                </select>
                <button class="btn btn-primary" onclick="loadMarketListings(1)">🔍 搜索</button>
                <button class="btn btn-outline" onclick="clearMarketFilters()">🔄 重置</button>
            </div>
            <div id="marketListingsContainer">
                <div class="loading"><div class="spinner"></div>加载中...</div>
            </div>
            <div class="pagination" id="marketPagination"></div>
        </div>
    </div>

    <div class="tab-content" id="tab-mine">
        <div class="section">
            <div class="section-title">📦 我的挂单</div>
            <div id="myListingsContainer">
                <div class="loading"><div class="spinner"></div>加载中...</div>
            </div>
        </div>
    </div>

    <div class="tab-content" id="tab-sell">
        <div class="section">
            <div class="section-title">💰 出售卡牌</div>
            <div class="form-row">
                <div class="form-group">
                    <label>选择游戏</label>
                    <select id="sellGameSelect" onchange="loadSellableCards()">
                        <option value="">请选择游戏</option>
                        <option value="dice">🎲 骰子大战</option>
                        <option value="blackjack">🃏 二十一点</option>
                        <option value="guess_number">🎯 猜数字</option>
                        <option value="rock_paper_scissors">🤖 石头剪刀布</option>
                        <option value="roulette">🎡 轮盘赌</option>
                        <option value="lucky_wheel">🎰 幸运转盘</option>
                        <option value="memory_cards">🧠 记忆翻牌</option>
                        <option value="whack_mole">🔨 打地鼠</option>
                        <option value="dice_royale">👑 骰子王者</option>
                        <option value="blackjack_tournament">🏆 21点锦标赛</option>
                        <option value="treasure_hunt">💎 寻宝迷宫</option>
                        <option value="boss_battle">⚔️ 挑战BOSS</option>
                    </select>
                </div>
            </div>
            <div id="sellCardPicker" style="margin-bottom:16px;"></div>
            <div class="form-row">
                <div class="form-group">
                    <label>出售数量</label>
                    <input type="number" id="sellQuantity" min="1" max="99" value="1">
                </div>
                <div class="form-group">
                    <label>单价（G币）</label>
                    <input type="number" id="sellPrice" min="1" max="1000000" value="100">
                </div>
                <div class="form-group" style="flex:0 0 auto">
                    <label style="opacity:0">操作</label>
                    <button class="btn btn-success" onclick="createListing()">💰 上架出售</button>
                </div>
            </div>
        </div>
    </div>

    <div class="tab-content" id="tab-exchange">
        <div class="section">
            <div class="section-title">🔄 积分 ↔ G币兑换</div>
            <div class="form-row">
                <div class="form-group">
                    <label>当前积分余额</label>
                    <input type="text" id="exchangePointsBalance" disabled>
                </div>
                <div class="form-group">
                    <label>当前G币余额</label>
                    <input type="text" id="exchangeGcoinsBalance" disabled>
                </div>
            </div>
            <div style="background:rgba(251,191,36,0.08);border:1px solid rgba(251,191,36,0.2);border-radius:12px;padding:16px;margin-bottom:16px;text-align:center;">
                <div style="font-size:14px;color:rgba(255,255,255,0.6);margin-bottom:8px;">兑换比例</div>
                <div style="font-size:24px;font-weight:700;color:#fbbf24;">1 积分 = 100 G币</div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>积分 → G币</label>
                    <input type="number" id="pointsToGcoinsInput" min="0.01" step="0.01" placeholder="输入积分数量">
                </div>
                <div class="form-group" style="flex:0 0 auto">
                    <label style="opacity:0">操作</label>
                    <button class="btn btn-primary" onclick="exchangePointsToGcoins()">🪙 兑换G币</button>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>G币 → 积分</label>
                    <input type="number" id="gcoinsToPointsInput" min="1" step="1" placeholder="输入G币数量">
                </div>
                <div class="form-group" style="flex:0 0 auto">
                    <label style="opacity:0">操作</label>
                    <button class="btn btn-success" onclick="exchangeGcoinsToPoints()">💧 兑换积分</button>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="buyModal">
    <div class="modal-box">
        <h3>确认购买</h3>
        <div class="modal-info" id="buyModalInfo"></div>
        <div class="modal-actions">
            <button class="btn-cancel-modal" onclick="closeBuyModal()">取消</button>
            <button class="btn-confirm" onclick="confirmBuy()">确认购买</button>
        </div>
    </div>
</div>

<script>
    var csrfToken = null;
    var csrfTokenLastFetch = 0;
    var currentGcoinBalance = 0;
    var currentPointsBalance = 0;
    var selectedCardForSell = null;
    var pendingBuyListingId = null;
    var currentPage = 1;

    function getCsrfTokenFromCookie() {
        try {
            var c = document.cookie.split(';');
            for (var i = 0; i < c.length; i++) {
                var cookie = c[i].trim();
                if (cookie.indexOf('csrf_token=') === 0) {
                    return cookie.substring('csrf_token='.length, cookie.length);
                }
            }
        } catch (e) {}
        return null;
    }

    function setCsrfTokenCookie(token) {
        try {
            var expires = new Date(Date.now() + 300000).toUTCString();
            document.cookie = 'csrf_token=' + token + '; expires=' + expires + '; path=/; SameSite=Strict; Secure';
        } catch (e) {}
    }

    async function fetchCsrfToken() {
        if (csrfToken && (Date.now() - csrfTokenLastFetch) < 300000) return csrfToken;
        var cookieToken = getCsrfTokenFromCookie();
        if (cookieToken) {
            csrfToken = cookieToken;
            csrfTokenLastFetch = Date.now();
            return csrfToken;
        }
        try {
            var res = await fetch('/api/csrf-token', {
                method: 'GET',
                credentials: 'include',
                headers: { 'Accept': 'application/json' }
            });
            var data = await res.json();
            if (data.csrf_token) {
                csrfToken = data.csrf_token;
                csrfTokenLastFetch = Date.now();
                setCsrfTokenCookie(csrfToken);
                return csrfToken;
            }
            throw new Error('No CSRF token');
        } catch (e) {
            throw new Error('Failed to fetch CSRF token');
        }
    }

    async function apiRequest(url, options) {
        if (!options) options = {};
        options.credentials = 'include';
        if (!options.headers) options.headers = {};
        options.headers['Content-Type'] = 'application/json';
        options.headers['Accept'] = 'application/json';
        var method = (options.method || 'GET').toUpperCase();
        if (method === 'GET' || method === 'HEAD') {
            var res = await fetch(url, options);
            var data = await res.json();
            if (!res.ok) throw new Error(data.error || '请求失败: ' + res.status);
            return data;
        }
        var token = await fetchCsrfToken();
        options.headers['X-CSRF-Token'] = token;
        var res = await fetch(url, options);
        var data = await res.json();
        if (!res.ok) {
            if (res.status === 403 && data.error && data.error.indexOf('CSRF') !== -1) {
                csrfToken = null;
                var newToken = await fetchCsrfToken();
                options.headers['X-CSRF-Token'] = newToken;
                var retryRes = await fetch(url, options);
                var retryData = await retryRes.json();
                if (!retryRes.ok) throw new Error(retryData.error || '请求失败: ' + retryRes.status);
                return retryData;
            }
            throw new Error(data.error || '请求失败: ' + res.status);
        }
        return data;
    }

    function showMessage(msg, type) {
        var d = document.createElement('div');
        d.className = 'message message-' + type;
        var icon = type === 'success' ? '✅' : type === 'error' ? '❌' : '⚠️';
        d.innerHTML = icon + ' ' + msg;
        document.body.appendChild(d);
        setTimeout(function() { d.remove(); }, 3500);
    }

    function escapeHtml(t) {
        if (!t) return '';
        var d = document.createElement('div');
        d.textContent = t;
        return d.innerHTML;
    }

    function switchTab(tab, evt) {
        document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
        document.querySelectorAll('.tab-content').forEach(function(t) { t.classList.remove('active'); });
        if (evt && evt.currentTarget) evt.currentTarget.classList.add('active');
        var content = document.getElementById('tab-' + tab);
        if (content) content.classList.add('active');
        if (tab === 'mine') loadMyListings();
        if (tab === 'sell') loadSellableCards();
        if (tab === 'exchange') loadExchangeBalances();
    }

    async function loadBalances() {
        try {
            var gcoinData = await apiRequest('/api/gcoin/balance');
            currentGcoinBalance = gcoinData.balance || 0;
            document.getElementById('gcoinBalance').textContent = currentGcoinBalance;
            var pointsData = await apiRequest('/api/get-points');
            currentPointsBalance = pointsData.totalPoints || 0;
        } catch (e) {
            console.error('Load balances error:', e);
        }
    }

    async function loadExchangeBalances() {
        try {
            var gcoinData = await apiRequest('/api/gcoin/balance');
            currentGcoinBalance = gcoinData.balance || 0;
            document.getElementById('gcoinBalance').textContent = currentGcoinBalance;
            var pointsData = await apiRequest('/api/get-points');
            currentPointsBalance = pointsData.totalPoints || 0;
            document.getElementById('exchangePointsBalance').value = currentPointsBalance.toFixed(2) + ' 积分';
            document.getElementById('exchangeGcoinsBalance').value = currentGcoinBalance + ' G币';
        } catch (e) {
            showMessage('加载余额失败: ' + e.message, 'error');
        }
    }

    async function loadMarketListings(page) {
        page = page || 1;
        currentPage = page;
        try {
            var params = new URLSearchParams();
            params.append('page', page);
            params.append('per_page', 20);
            var gameFilter = document.getElementById('marketGameFilter').value;
            var rarityFilter = document.getElementById('marketRarityFilter').value;
            var search = document.getElementById('marketSearch').value.trim();
            if (gameFilter) params.append('game_id', gameFilter);
            if (rarityFilter) params.append('rarity', rarityFilter);
            if (search) params.append('search', search);

            var data = await apiRequest('/api/market/listings?' + params.toString());
            var container = document.getElementById('marketListingsContainer');
            if (!data.listings || data.listings.length === 0) {
                container.innerHTML = '<div class="empty-state"><span class="icon">📭</span>暂无挂单</div>';
                document.getElementById('marketPagination').innerHTML = '';
                return;
            }
            var html = '<div class="listing-grid">';
            data.listings.forEach(function(listing) {
                html += '<div class="listing-card ' + listing.rarity + '">';
                html += '<div class="listing-header">';
                html += '<div class="listing-emoji">' + listing.card_emoji + '</div>';
                html += '<div class="listing-info">';
                html += '<div class="listing-name">' + escapeHtml(listing.card_name) + '</div>';
                html += '<div class="listing-rarity" style="color:' + listing.rarity_color + '">' + listing.rarity_name + '</div>';
                html += '<div class="listing-seller">卖家: ' + escapeHtml(listing.seller) + '</div>';
                html += '</div>';
                html += '</div>';
                html += '<div class="listing-price">';
                html += '<div class="listing-price-text">🪙 ' + listing.price_gcoins + '</div>';
                html += '<div class="listing-quantity">x' + listing.quantity + '</div>';
                html += '</div>';
                html += '<button class="btn-buy" onclick="openBuyModal(\'' + listing.id + '\')">🛒 购买</button>';
                html += '</div>';
            });
            html += '</div>';
            container.innerHTML = html;
            renderMarketPagination(data.page, data.total_pages);
        } catch (e) {
            document.getElementById('marketListingsContainer').innerHTML = '<div class="loading">加载失败: ' + escapeHtml(e.message) + '</div>';
        }
    }

    function renderMarketPagination(currentPage, totalPages) {
        var container = document.getElementById('marketPagination');
        if (totalPages <= 1) {
            container.innerHTML = '';
            return;
        }
        var html = '';
        for (var i = 1; i <= totalPages; i++) {
            html += '<button class="' + (i === currentPage ? 'active' : '') + '" onclick="loadMarketListings(' + i + ')">' + i + '</button>';
        }
        container.innerHTML = html;
    }

    function clearMarketFilters() {
        document.getElementById('marketSearch').value = '';
        document.getElementById('marketGameFilter').value = '';
        document.getElementById('marketRarityFilter').value = '';
        loadMarketListings(1);
    }

    async function loadMyListings() {
        try {
            var data = await apiRequest('/api/market/my-listings');
            var container = document.getElementById('myListingsContainer');
            if (!data.listings || data.listings.length === 0) {
                container.innerHTML = '<div class="empty-state"><span class="icon">📭</span>暂无挂单</div>';
                return;
            }
            var html = '<div class="listing-grid">';
            data.listings.forEach(function(listing) {
                html += '<div class="listing-card ' + listing.rarity + '">';
                html += '<div class="listing-header">';
                html += '<div class="listing-emoji">' + listing.card_emoji + '</div>';
                html += '<div class="listing-info">';
                html += '<div class="listing-name">' + escapeHtml(listing.card_name) + '</div>';
                html += '<div class="listing-rarity" style="color:' + listing.rarity_color + '">' + listing.rarity_name + '</div>';
                html += '</div>';
                html += '</div>';
                html += '<div class="listing-price">';
                html += '<div class="listing-price-text">🪙 ' + listing.price_gcoins + '</div>';
                html += '<div class="listing-quantity">x' + listing.quantity + '</div>';
                html += '</div>';
                html += '<button class="btn-cancel" onclick="cancelListing(\'' + listing.id + '\')">❌ 取消挂单</button>';
                html += '</div>';
            });
            html += '</div>';
            container.innerHTML = html;
        } catch (e) {
            document.getElementById('myListingsContainer').innerHTML = '<div class="loading">加载失败: ' + escapeHtml(e.message) + '</div>';
        }
    }

    async function cancelListing(listingId) {
        if (!confirm('确定要取消该挂单吗？卡牌将返还到您的背包。')) return;
        try {
            var data = await apiRequest('/api/market/cancel', {
                method: 'POST',
                body: JSON.stringify({ listing_id: listingId })
            });
            showMessage(data.message, 'success');
            loadMyListings();
            loadMarketListings(currentPage);
            loadBalances();
        } catch (e) {
            showMessage(e.message, 'error');
        }
    }

    async function loadSellableCards() {
        var gameId = document.getElementById('sellGameSelect').value;
        var picker = document.getElementById('sellCardPicker');
        selectedCardForSell = null;
        if (!gameId) {
            picker.innerHTML = '<div style="text-align:center;padding:20px;color:rgba(255,255,255,0.4);font-size:13px;">请先选择游戏</div>';
            return;
        }
        try {
            var data = await apiRequest('/api/game/collection/overview');
            var gameProgress = data.game_progress[gameId];
            if (!gameProgress) {
                picker.innerHTML = '<div style="text-align:center;padding:20px;color:rgba(255,255,255,0.4);font-size:13px;">该游戏无卡牌数据</div>';
                return;
            }
            var availableCards = gameProgress.cards.filter(function(c) { return c.count > 1; });
            if (availableCards.length === 0) {
                picker.innerHTML = '<div style="text-align:center;padding:20px;color:rgba(255,255,255,0.4);font-size:13px;">没有可出售的重复卡牌（至少需保留1张）</div>';
                return;
            }
            var html = '<div class="card-picker">';
            availableCards.forEach(function(card) {
                html += '<div class="card-pick-item" data-game="' + gameId + '" data-card="' + card.id + '" onclick="selectCardForSell(this, \'' + gameId + '\', \'' + card.id + '\', \'' + card.name + '\', \'' + card.emoji + '\', \'' + card.rarity + '\')">';
                html += '<span class="cp-emoji">' + card.emoji + '</span>';
                html += '<div class="cp-name">' + escapeHtml(card.name) + '</div>';
                html += '<div class="cp-count">可售 ' + (card.count - 1) + '</div>';
                html += '</div>';
            });
            html += '</div>';
            picker.innerHTML = html;
        } catch (e) {
            picker.innerHTML = '<div style="text-align:center;padding:20px;color:#f87171;font-size:13px;">加载失败: ' + escapeHtml(e.message) + '</div>';
        }
    }

    function selectCardForSell(el, gameId, cardId, cardName, cardEmoji, rarity) {
        document.querySelectorAll('.card-pick-item').forEach(function(i) { i.classList.remove('selected'); });
        el.classList.add('selected');
        selectedCardForSell = {
            game_id: gameId,
            card_id: cardId,
            card_name: cardName,
            card_emoji: cardEmoji,
            rarity: rarity
        };
    }

    async function createListing() {
        if (!selectedCardForSell) {
            showMessage('请选择要出售的卡牌', 'error');
            return;
        }
        var quantity = parseInt(document.getElementById('sellQuantity').value);
        var price = parseInt(document.getElementById('sellPrice').value);
        if (isNaN(quantity) || quantity < 1) {
            showMessage('请输入有效的数量', 'error');
            return;
        }
        if (isNaN(price) || price < 1) {
            showMessage('请输入有效的价格', 'error');
            return;
        }
        try {
            var data = await apiRequest('/api/market/create', {
                method: 'POST',
                body: JSON.stringify({
                    game_id: selectedCardForSell.game_id,
                    card_id: selectedCardForSell.card_id,
                    quantity: quantity,
                    price_gcoins: price
                })
            });
            showMessage(data.message, 'success');
            selectedCardForSell = null;
            document.getElementById('sellQuantity').value = 1;
            document.getElementById('sellPrice').value = 100;
            loadSellableCards();
            loadMyListings();
            loadMarketListings(1);
        } catch (e) {
            showMessage(e.message, 'error');
        }
    }

    function openBuyModal(listingId) {
        pendingBuyListingId = listingId;
        apiRequest('/api/market/listings?per_page=1000').then(function(data) {
            var listing = data.listings.find(function(l) { return l.id === listingId; });
            if (!listing) {
                showMessage('挂单不存在', 'error');
                return;
            }
            var totalPrice = listing.price_gcoins * listing.quantity;
            var infoHtml = '';
            infoHtml += '<div class="info-row"><span class="label">卡牌</span><span class="value">' + listing.card_emoji + ' ' + escapeHtml(listing.card_name) + '</span></div>';
            infoHtml += '<div class="info-row"><span class="label">稀有度</span><span class="value" style="color:' + listing.rarity_color + '">' + listing.rarity_name + '</span></div>';
            infoHtml += '<div class="info-row"><span class="label">数量</span><span class="value">x' + listing.quantity + '</span></div>';
            infoHtml += '<div class="info-row"><span class="label">单价</span><span class="value gold">🪙 ' + listing.price_gcoins + '</span></div>';
            infoHtml += '<div class="info-row"><span class="label">总价</span><span class="value gold">🪙 ' + totalPrice + '</span></div>';
            infoHtml += '<div class="info-row"><span class="label">您的余额</span><span class="value">🪙 ' + currentGcoinBalance + '</span></div>';
            document.getElementById('buyModalInfo').innerHTML = infoHtml;
            document.getElementById('buyModal').classList.add('active');
        });
    }

    function closeBuyModal() {
        document.getElementById('buyModal').classList.remove('active');
        pendingBuyListingId = null;
    }

    async function confirmBuy() {
        if (!pendingBuyListingId) return;
        try {
            var data = await apiRequest('/api/market/buy', {
                method: 'POST',
                body: JSON.stringify({ listing_id: pendingBuyListingId })
            });
            showMessage(data.message, 'success');
            closeBuyModal();
            loadBalances();
            loadMarketListings(currentPage);
        } catch (e) {
            showMessage(e.message, 'error');
        }
    }

    async function exchangePointsToGcoins() {
        var input = document.getElementById('pointsToGcoinsInput');
        var pointsAmount = parseFloat(input.value);
        if (isNaN(pointsAmount) || pointsAmount <= 0) {
            showMessage('请输入有效的积分数量', 'error');
            return;
        }
        if (pointsAmount > currentPointsBalance) {
            showMessage('积分不足', 'error');
            return;
        }
        try {
            var data = await apiRequest('/api/gcoin/exchange/points-to-gcoins', {
                method: 'POST',
                body: JSON.stringify({ points: pointsAmount })
            });
            showMessage(data.message, 'success');
            input.value = '';
            loadExchangeBalances();
            loadBalances();
        } catch (e) {
            showMessage(e.message, 'error');
        }
    }

    async function exchangeGcoinsToPoints() {
        var input = document.getElementById('gcoinsToPointsInput');
        var gcoinAmount = parseInt(input.value);
        if (isNaN(gcoinAmount) || gcoinAmount <= 0) {
            showMessage('请输入有效的G币数量', 'error');
            return;
        }
        if (gcoinAmount > currentGcoinBalance) {
            showMessage('G币不足', 'error');
            return;
        }
        try {
            var data = await apiRequest('/api/gcoin/exchange/gcoins-to-points', {
                method: 'POST',
                body: JSON.stringify({ gcoins: gcoinAmount })
            });
            showMessage(data.message, 'success');
            input.value = '';
            loadExchangeBalances();
            loadBalances();
        } catch (e) {
            showMessage(e.message, 'error');
        }
    }

    document.getElementById('buyModal').addEventListener('click', function(e) {
        if (e.target === this) closeBuyModal();
    });

    document.getElementById('marketSearch').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') loadMarketListings(1);
    });

    document.addEventListener('DOMContentLoaded', function() {
        loadBalances();
        loadMarketListings(1);
    });

    setInterval(loadBalances, 30000);
</script>
</body>
</html>
