<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🔄 积分 G币兑换</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        body{font-family:'Segoe UI','PingFang SC',sans-serif;background:linear-gradient(135deg,#0a0a1a 0%,#1a1a3e 50%,#0d0d2b 100%);min-height:100vh;color:#e8e8f0;padding:20px;touch-action:manipulation}
        .container{max-width:800px;margin:0 auto}
        .header{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;background:rgba(255,255,255,0.06);border-radius:20px;border:1px solid rgba(255,255,255,0.08);margin-bottom:24px;flex-wrap:wrap;gap:12px}
        .header h1{font-size:24px;background:linear-gradient(135deg,#fbbf24,#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        .header .right-group{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
        .header .gcoin-badge{background:linear-gradient(135deg,#fbbf24,#d97706);color:#1a1a2e;padding:6px 16px;border-radius:20px;font-weight:700;font-size:14px}
        .header .back-btn{padding:8px 20px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.1);border-radius:40px;color:#d1d5db;cursor:pointer;transition:all 0.3s;font-size:13px;text-decoration:none;min-height:40px;display:flex;align-items:center}
        .header .back-btn:hover{background:rgba(255,255,255,0.15)}
        .section{background:rgba(255,255,255,0.04);border-radius:20px;padding:24px;border:1px solid rgba(255,255,255,0.06);margin-bottom:20px}
        .section-title{font-size:18px;font-weight:700;color:#fff;margin-bottom:16px;display:flex;align-items:center;gap:10px}
        .balance-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
        .balance-card{background:rgba(255,255,255,0.04);border-radius:16px;padding:20px;text-align:center;border:1px solid rgba(255,255,255,0.08)}
        .balance-card .label{font-size:12px;color:rgba(255,255,255,0.5);margin-bottom:8px}
        .balance-card .value{font-size:28px;font-weight:700}
        .balance-card .value.points{color:#60a5fa}
        .balance-card .value.gcoins{color:#fbbf24}
        .rate-box{background:rgba(251,191,36,0.08);border:1px solid rgba(251,191,36,0.2);border-radius:12px;padding:16px;margin-bottom:24px;text-align:center}
        .rate-box .rate-label{font-size:14px;color:rgba(255,255,255,0.6);margin-bottom:8px}
        .rate-box .rate-value{font-size:24px;font-weight:700;color:#fbbf24}
        .exchange-form{display:flex;flex-direction:column;gap:16px}
        .exchange-group{background:rgba(255,255,255,0.03);border-radius:16px;padding:20px;border:1px solid rgba(255,255,255,0.06)}
        .exchange-group .group-title{font-size:15px;font-weight:600;color:#fff;margin-bottom:12px;display:flex;align-items:center;gap:8px}
        .exchange-group .input-row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
        .exchange-group .input-row .form-group{flex:1;min-width:160px}
        .exchange-group .input-row .form-group label{display:block;margin-bottom:6px;font-size:12px;color:rgba(255,255,255,0.5);font-weight:500}
        .exchange-group .input-row .form-group input{width:100%;padding:12px 16px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);border-radius:12px;color:#fff;font-size:16px;outline:none;transition:all 0.25s;min-height:48px}
        .exchange-group .input-row .form-group input:focus{border-color:#667eea}
        .exchange-group .input-row .form-group input::-webkit-outer-spin-button,
        .exchange-group .input-row .form-group input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
        .exchange-group .input-row .form-group input[type=number]{-moz-appearance:textfield}
        .exchange-group .input-row .btn{min-height:48px;padding:12px 32px;font-size:15px;font-weight:600;border:none;border-radius:12px;cursor:pointer;transition:all 0.3s;white-space:nowrap}
        .btn-primary{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
        .btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(102,126,234,0.3)}
        .btn-success{background:linear-gradient(135deg,#34d399,#059669);color:#fff}
        .btn-success:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(52,211,153,0.3)}
        .btn:disabled{opacity:0.5;cursor:not-allowed;transform:none}
        .preview-text{font-size:13px;color:rgba(255,255,255,0.5);margin-top:8px;min-height:20px}
        .preview-text .highlight{color:#fbbf24;font-weight:600}
        .message{position:fixed;bottom:24px;right:24px;padding:14px 24px;border-radius:16px;z-index:9999;animation:slideUp 0.35s ease;max-width:420px;box-shadow:0 12px 40px rgba(0,0,0,0.5);font-size:14px;display:flex;align-items:center;gap:10px}
        .message-success{background:#065f46;color:#a7f3d0;border:1px solid rgba(52,211,153,0.2)}
        .message-error{background:#7f1d1d;color:#fca5a5;border:1px solid rgba(239,68,68,0.2)}
        @keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
        .loading{text-align:center;padding:40px;color:rgba(255,255,255,0.3)}
        .loading .spinner{width:40px;height:40px;border:3px solid rgba(255,255,255,0.1);border-top-color:#fbbf24;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px}
        @keyframes spin{to{transform:rotate(360deg)}}
        @media(max-width:600px){
            body{padding:12px}
            .header{padding:12px 16px}
            .header h1{font-size:20px}
            .section{padding:16px}
            .balance-row{grid-template-columns:1fr 1fr;gap:10px}
            .balance-card{padding:14px}
            .balance-card .value{font-size:22px}
            .exchange-group{padding:16px}
            .exchange-group .input-row{flex-direction:column}
            .exchange-group .input-row .form-group{min-width:100%}
            .exchange-group .input-row .btn{width:100%}
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🔄 积分 ↔ G币兑换</h1>
        <div class="right-group">
            <div class="gcoin-badge">🪙 <span id="gcoinBalance">0</span> G币</div>
            <a href="/GAME/" class="back-btn">← 返回游戏大厅</a>
        </div>
    </div>

    <div class="section">
        <div class="section-title">💰 当前余额</div>
        <div class="balance-row">
            <div class="balance-card">
                <div class="label">💧 积分余额</div>
                <div class="value points" id="pointsBalance">0</div>
            </div>
            <div class="balance-card">
                <div class="label">🪙 G币余额</div>
                <div class="value gcoins" id="gcoinsBalance">0</div>
            </div>
        </div>

        <div class="rate-box">
            <div class="rate-label">兑换比例</div>
            <div class="rate-value">1 积分 = 100 G币</div>
        </div>

        <div class="exchange-form">
            <div class="exchange-group">
                <div class="group-title">💧 积分 → 🪙 G币</div>
                <div class="input-row">
                    <div class="form-group">
                        <label>输入积分数量</label>
                        <input type="number" id="pointsToGcoinsInput" min="0.01" step="0.01" placeholder="输入积分数量">
                    </div>
                    <button class="btn btn-primary" onclick="exchangePointsToGcoins()">🪙 兑换G币</button>
                </div>
                <div class="preview-text" id="pointsPreview"></div>
            </div>

            <div class="exchange-group">
                <div class="group-title">🪙 G币 → 💧 积分</div>
                <div class="input-row">
                    <div class="form-group">
                        <label>输入G币数量</label>
                        <input type="number" id="gcoinsToPointsInput" min="1" step="1" placeholder="输入G币数量">
                    </div>
                    <button class="btn btn-success" onclick="exchangeGcoinsToPoints()">💧 兑换积分</button>
                </div>
                <div class="preview-text" id="gcoinsPreview"></div>
            </div>
        </div>
    </div>
</div>

<script>
    var csrfToken = null;
    var csrfTokenLastFetch = 0;
    var currentGcoinBalance = 0;
    var currentPointsBalance = 0;

    function getCsrfTokenFromCookie() {
        try {
            var c = document.cookie.split(';');
            for (var i = 0; i < c.length; i++) {
                var cookie = c[i].trim();
                if (cookie.indexOf('csrf_token=') === 0) {
                    return cookie.substring('csrf_token='.length, cookie.length);
                }
            }
        } catch (e) {}
        return null;
    }

    function setCsrfTokenCookie(token) {
        try {
            var expires = new Date(Date.now() + 300000).toUTCString();
            document.cookie = 'csrf_token=' + token + '; expires=' + expires + '; path=/; SameSite=Strict; Secure';
        } catch (e) {}
    }

    async function fetchCsrfToken() {
        if (csrfToken && (Date.now() - csrfTokenLastFetch) < 300000) return csrfToken;
        var cookieToken = getCsrfTokenFromCookie();
        if (cookieToken) {
            csrfToken = cookieToken;
            csrfTokenLastFetch = Date.now();
            return csrfToken;
        }
        try {
            var res = await fetch('/api/csrf-token', {
                method: 'GET',
                credentials: 'include',
                headers: { 'Accept': 'application/json' }
            });
            var data = await res.json();
            if (data.csrf_token) {
                csrfToken = data.csrf_token;
                csrfTokenLastFetch = Date.now();
                setCsrfTokenCookie(csrfToken);
                return csrfToken;
            }
            throw new Error('No CSRF token');
        } catch (e) {
            throw new Error('Failed to fetch CSRF token');
        }
    }

    async function apiRequest(url, options) {
        if (!options) options = {};
        options.credentials = 'include';
        if (!options.headers) options.headers = {};
        options.headers['Content-Type'] = 'application/json';
        options.headers['Accept'] = 'application/json';
        var method = (options.method || 'GET').toUpperCase();
        if (method === 'GET' || method === 'HEAD') {
            var res = await fetch(url, options);
            var data = await res.json();
            if (!res.ok) throw new Error(data.error || '请求失败: ' + res.status);
            return data;
        }
        var token = await fetchCsrfToken();
        options.headers['X-CSRF-Token'] = token;
        var res = await fetch(url, options);
        var data = await res.json();
        if (!res.ok) {
            if (res.status === 403 && data.error && data.error.indexOf('CSRF') !== -1) {
                csrfToken = null;
                var newToken = await fetchCsrfToken();
                options.headers['X-CSRF-Token'] = newToken;
                var retryRes = await fetch(url, options);
                var retryData = await retryRes.json();
                if (!retryRes.ok) throw new Error(retryData.error || '请求失败: ' + retryRes.status);
                return retryData;
            }
            throw new Error(data.error || '请求失败: ' + res.status);
        }
        return data;
    }

    function showMessage(msg, type) {
        var d = document.createElement('div');
        d.className = 'message message-' + type;
        var icon = type === 'success' ? '✅' : '❌';
        d.innerHTML = icon + ' ' + msg;
        document.body.appendChild(d);
        setTimeout(function() { d.remove(); }, 3500);
    }

    async function loadBalances() {
        try {
            var gcoinData = await apiRequest('/api/gcoin/balance');
            currentGcoinBalance = gcoinData.balance || 0;
            document.getElementById('gcoinBalance').textContent = currentGcoinBalance;
            document.getElementById('gcoinsBalance').textContent = currentGcoinBalance;
            var pointsData = await apiRequest('/api/get-points');
            currentPointsBalance = pointsData.totalPoints || 0;
            document.getElementById('pointsBalance').textContent = currentPointsBalance.toFixed(2);
            updatePointsPreview();
            updateGcoinsPreview();
        } catch (e) {
            console.error('Load balances error:', e);
        }
    }

    function updatePointsPreview() {
        var input = document.getElementById('pointsToGcoinsInput');
        var preview = document.getElementById('pointsPreview');
        var val = parseFloat(input.value);
        if (isNaN(val) || val <= 0) {
            preview.innerHTML = '';
            return;
        }
        var gcoins = Math.floor(val * 100);
        preview.innerHTML = '将获得 <span class="highlight">' + gcoins + ' G币</span>';
    }

    function updateGcoinsPreview() {
        var input = document.getElementById('gcoinsToPointsInput');
        var preview = document.getElementById('gcoinsPreview');
        var val = parseInt(input.value);
        if (isNaN(val) || val <= 0) {
            preview.innerHTML = '';
            return;
        }
        var points = (val / 100).toFixed(2);
        preview.innerHTML = '将获得 <span class="highlight">' + points + ' 积分</span>';
    }

    async function exchangePointsToGcoins() {
        var input = document.getElementById('pointsToGcoinsInput');
        var pointsAmount = parseFloat(input.value);
        if (isNaN(pointsAmount) || pointsAmount <= 0) {
            showMessage('请输入有效的积分数量', 'error');
            return;
        }
        if (pointsAmount > currentPointsBalance) {
            showMessage('积分不足', 'error');
            return;
        }
        var btn = event.target;
        btn.disabled = true;
        try {
            var data = await apiRequest('/api/gcoin/exchange/points-to-gcoins', {
                method: 'POST',
                body: JSON.stringify({ points: pointsAmount })
            });
            showMessage(data.message, 'success');
            input.value = '';
            await loadBalances();
        } catch (e) {
            showMessage(e.message, 'error');
        } finally {
            btn.disabled = false;
        }
    }

    async function exchangeGcoinsToPoints() {
        var input = document.getElementById('gcoinsToPointsInput');
        var gcoinAmount = parseInt(input.value);
        if (isNaN(gcoinAmount) || gcoinAmount <= 0) {
            showMessage('请输入有效的G币数量', 'error');
            return;
        }
        if (gcoinAmount > currentGcoinBalance) {
            showMessage('G币不足', 'error');
            return;
        }
        var btn = event.target;
        btn.disabled = true;
        try {
            var data = await apiRequest('/api/gcoin/exchange/gcoins-to-points', {
                method: 'POST',
                body: JSON.stringify({ gcoins: gcoinAmount })
            });
            showMessage(data.message, 'success');
            input.value = '';
            await loadBalances();
        } catch (e) {
            showMessage(e.message, 'error');
        } finally {
            btn.disabled = false;
        }
    }

    document.getElementById('pointsToGcoinsInput').addEventListener('input', updatePointsPreview);
    document.getElementById('gcoinsToPointsInput').addEventListener('input', updateGcoinsPreview);

    document.addEventListener('DOMContentLoaded', function() {
        loadBalances();
    });

    setInterval(loadBalances, 30000);
</script>
</body>
</html>
