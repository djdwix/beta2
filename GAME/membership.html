<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>👑 游戏会员中心</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        body{font-family:'Segoe UI','PingFang SC',sans-serif;background:linear-gradient(135deg,#0a0a1a 0%,#1a1a3e 50%,#0d0d2b 100%);min-height:100vh;color:#e8e8f0;padding:20px;touch-action:manipulation}
        .container{max-width:1200px;margin:0 auto}
        .header{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;background:rgba(255,255,255,0.06);border-radius:20px;border:1px solid rgba(255,255,255,0.08);margin-bottom:24px;flex-wrap:wrap;gap:12px}
        .header h1{font-size:24px;background:linear-gradient(135deg,#fbbf24,#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        .header .back-btn{padding:8px 20px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.1);border-radius:40px;color:#d1d5db;cursor:pointer;transition:all 0.3s;font-size:13px;text-decoration:none;min-height:40px;display:flex;align-items:center}
        .header .back-btn:hover{background:rgba(255,255,255,0.15)}
        .status-bar{background:rgba(255,255,255,0.04);border-radius:16px;padding:20px 24px;border:1px solid rgba(255,255,255,0.06);margin-bottom:20px;display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between;align-items:center}
        .status-bar .label{font-size:13px;color:rgba(255,255,255,0.4)}
        .status-bar .value{font-size:18px;font-weight:600;color:#fff}
        .status-bar .value.gold{color:#fbbf24}
        .status-bar .value.green{color:#34d399}
        .status-bar .value.purple{color:#a78bfa}
        .status-bar .value.pink{color:#ec4899}
        .status-bar .item{display:flex;flex-direction:column;gap:2px}
        .message{position:fixed;bottom:24px;right:24px;padding:14px 24px;border-radius:16px;z-index:9999;animation:slideUp 0.35s ease;max-width:420px;box-shadow:0 12px 40px rgba(0,0,0,0.5);font-size:14px;display:flex;align-items:center;gap:10px}
        .message-success{background:#065f46;color:#a7f3d0;border:1px solid rgba(52,211,153,0.2)}
        .message-error{background:#7f1d1d;color:#fca5a5;border:1px solid rgba(239,68,68,0.2)}
        .message-warning{background:#78350f;color:#fde68a;border:1px solid rgba(251,191,36,0.2)}
        @keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
        .loading{text-align:center;padding:40px;color:rgba(255,255,255,0.3)}
        .skeleton{background:rgba(255,255,255,0.04);border-radius:20px;padding:24px;position:relative;overflow:hidden;min-height:280px}
        .skeleton::after{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.06),transparent);animation:shimmer 1.5s infinite}
        @keyframes shimmer{0%{left:-100%}100%{left:100%}}
        .skeleton-line{background:rgba(255,255,255,0.06);border-radius:8px;height:20px;margin-bottom:16px}
        .skeleton-line.short{width:60%}
        .skeleton-line.circle{width:64px;height:64px;border-radius:50%;margin:0 auto 16px}
        .bonus-info-box{background:rgba(251,191,36,0.08);border-radius:16px;padding:16px 20px;border:1px solid rgba(251,191,36,0.15);margin-bottom:24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
        .bonus-info-box .bonus-icon{font-size:28px}
        .bonus-info-box .bonus-text{font-size:14px;color:rgba(255,255,255,0.7);line-height:1.6}
        .bonus-info-box .bonus-text strong{color:#fbbf24}
        .tier-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;margin-bottom:24px}
        .tier-card{background:linear-gradient(145deg,rgba(255,255,255,0.04),rgba(255,255,255,0.01));border-radius:24px;padding:28px 24px;border:1px solid rgba(255,255,255,0.08);text-align:center;transition:all 0.3s;position:relative;display:flex;flex-direction:column}
        .tier-card:hover{transform:translateY(-4px);box-shadow:0 12px 40px rgba(0,0,0,0.3)}
        .tier-card.normal{border-color:rgba(251,191,36,0.2);background:linear-gradient(145deg,rgba(251,191,36,0.06),rgba(245,158,11,0.01))}
        .tier-card.gold{border-color:rgba(245,158,11,0.3);background:linear-gradient(145deg,rgba(245,158,11,0.08),rgba(217,119,6,0.01))}
        .tier-card.diamond{border-color:rgba(167,139,250,0.3);background:linear-gradient(145deg,rgba(167,139,250,0.08),rgba(124,58,237,0.01))}
        .tier-card.supreme{border-color:rgba(236,72,153,0.4);background:linear-gradient(145deg,rgba(236,72,153,0.1),rgba(190,24,93,0.02))}
        .tier-card.current{border-color:rgba(52,211,153,0.4);background:linear-gradient(145deg,rgba(52,211,153,0.08),rgba(5,150,105,0.01))}
        .tier-card .crown{font-size:56px;display:block;margin-bottom:12px}
        .tier-card .tier-name{font-size:22px;font-weight:700;margin-bottom:4px}
        .tier-card.normal .tier-name{color:#fbbf24}
        .tier-card.gold .tier-name{color:#f59e0b}
        .tier-card.diamond .tier-name{color:#a78bfa}
        .tier-card.supreme .tier-name{color:#ec4899}
        .tier-card.current .tier-name{color:#34d399}
        .tier-card .tier-subtitle{font-size:13px;color:rgba(255,255,255,0.5);margin-bottom:16px}
        .tier-card .tier-price{font-size:32px;font-weight:700;color:#fff;margin:12px 0}
        .tier-card .tier-price small{font-size:16px;color:rgba(255,255,255,0.4);font-weight:400}
        .tier-card .tier-perks{text-align:left;margin:16px 0;display:grid;gap:10px;flex:1}
        .tier-card .tier-perk{font-size:13px;color:rgba(255,255,255,0.75);display:flex;align-items:flex-start;gap:8px;line-height:1.5}
        .tier-card .tier-perk .icon{flex-shrink:0;font-size:14px}
        .tier-card .tier-perk.highlight{color:#fbbf24;font-weight:600}
        .tier-card .tier-btn{width:100%;padding:12px;border:none;border-radius:40px;font-size:15px;font-weight:600;cursor:pointer;transition:all 0.3s;min-height:48px;margin-top:8px}
        .tier-card .tier-btn.buy-normal{background:linear-gradient(135deg,#fbbf24,#d97706);color:#1a1a2e}
        .tier-card .tier-btn.buy-gold{background:linear-gradient(135deg,#f59e0b,#b45309);color:#fff}
        .tier-card .tier-btn.buy-diamond{background:linear-gradient(135deg,#a78bfa,#7c3aed);color:#fff}
        .tier-card .tier-btn.buy-supreme{background:linear-gradient(135deg,#ec4899,#be185d);color:#fff}
        .tier-card .tier-btn.upgrade{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
        .tier-card .tier-btn:hover{transform:scale(1.02);box-shadow:0 8px 25px rgba(0,0,0,0.3)}
        .tier-card .tier-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none;box-shadow:none}
        .tier-card .tier-btn.current-btn{background:rgba(52,211,153,0.2);color:#34d399;cursor:not-allowed}
        .tier-card .current-badge{position:absolute;top:16px;right:16px;font-size:11px;background:linear-gradient(135deg,#34d399,#059669);color:#1a1a2e;padding:4px 12px;border-radius:10px;font-weight:700}
        .tier-card .popular-badge{position:absolute;top:-10px;left:50%;transform:translateX(-50%);font-size:11px;background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;padding:4px 16px;border-radius:10px;font-weight:700;white-space:nowrap}
        .tier-card .supreme-badge{position:absolute;top:-10px;left:50%;transform:translateX(-50%);font-size:11px;background:linear-gradient(135deg,#ec4899,#be185d);color:#fff;padding:4px 16px;border-radius:10px;font-weight:700;white-space:nowrap}
        .req-box{margin-top:12px;padding:12px;background:rgba(255,255,255,0.04);border-radius:12px;text-align:left}
        .req-box .req-title{font-size:12px;color:rgba(255,255,255,0.5);margin-bottom:8px}
        .req-box .req-item{font-size:12px;display:flex;justify-content:space-between;margin-bottom:4px}
        .req-box .req-item.met{color:#34d399}
        .req-box .req-item.not-met{color:#f87171}
        .active-card{background:linear-gradient(145deg,rgba(52,211,153,0.1),rgba(5,150,105,0.02));border-radius:24px;padding:32px;border:1px solid rgba(52,211,153,0.2);text-align:center;margin-bottom:24px}
        .active-card.supreme-active{background:linear-gradient(145deg,rgba(236,72,153,0.12),rgba(190,24,93,0.02));border-color:rgba(236,72,153,0.3)}
        .active-card .crown-active{font-size:64px;display:block;margin-bottom:12px}
        .active-card .title-active{font-size:28px;font-weight:700;color:#34d399;margin-bottom:8px}
        .active-card.supreme-active .title-active{color:#ec4899}
        .active-card .subtitle-active{font-size:15px;color:rgba(255,255,255,0.5);margin-bottom:20px}
        .active-card .perks-active{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:20px 0;text-align:left}
        .active-card .perks-active .perk-active{background:rgba(52,211,153,0.08);padding:12px 16px;border-radius:12px;display:flex;align-items:center;gap:10px;font-size:14px;color:rgba(255,255,255,0.8)}
        .active-card.supreme-active .perks-active .perk-active{background:rgba(236,72,153,0.08)}
        .active-card .active-badge{display:inline-block;padding:8px 28px;background:linear-gradient(135deg,#34d399,#059669);color:#1a1a2e;border-radius:40px;font-size:16px;font-weight:700;margin-top:8px}
        .active-card.supreme-active .active-badge{background:linear-gradient(135deg,#ec4899,#be185d);color:#fff}
        .upgrade-section{margin-top:24px}
        .upgrade-section h3{font-size:18px;color:#fff;margin-bottom:16px;text-align:center}
        @media(max-width:768px){
            body{padding:12px}
            .header{padding:12px 16px}
            .header h1{font-size:20px}
            .tier-grid{grid-template-columns:1fr;gap:16px}
            .tier-card{padding:20px 16px}
            .tier-card .tier-price{font-size:26px}
            .status-bar{flex-direction:column;align-items:flex-start;gap:12px}
            .active-card{padding:20px}
            .active-card .crown-active{font-size:48px}
            .active-card .title-active{font-size:22px}
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>👑 游戏会员中心</h1>
        <a href="/GAME/" class="back-btn">← 返回游戏大厅</a>
    </div>

    <div id="loadingState">
        <div class="skeleton">
            <div class="skeleton-line circle"></div>
            <div class="skeleton-line"></div>
            <div class="skeleton-line short"></div>
        </div>
    </div>

    <div id="mainContent" style="display:none;">
        <div class="status-bar" id="statusBar">
            <div class="item">
                <span class="label">会员状态</span>
                <span class="value" id="membershipStatus">❌ 未开通</span>
            </div>
            <div class="item">
                <span class="label">每日游戏次数</span>
                <span class="value" id="dailyPlays">0 / 5</span>
            </div>
            <div class="item">
                <span class="label">获胜积分加成</span>
                <span class="value" id="bonusRate">+0%</span>
            </div>
            <div class="item" id="expiryItem">
                <span class="label">会员等级</span>
                <span class="value gold" id="tierName">普通用户</span>
            </div>
        </div>

        <div id="notMemberSection">
            <div class="bonus-info-box">
                <span class="bonus-icon">💡</span>
                <div class="bonus-text">
                    开通会员后享受更多游戏次数和积分加成，<strong>一次购买永久有效</strong>。
                </div>
            </div>

            <div class="tier-grid" id="tierGrid"></div>
        </div>

        <div id="memberSection" style="display:none;">
            <div class="active-card" id="activeCard">
                <span class="crown-active" id="activeCrown">👑</span>
                <div class="title-active" id="activeTitle">会员已激活</div>
                <div class="subtitle-active" id="activeSubtitle">您已享受全部会员权益</div>
                <div class="perks-active" id="activePerks"></div>
                <div class="active-badge" id="activeBadge">✅ 会员已激活</div>
            </div>

            <div class="upgrade-section" id="upgradeSection" style="display:none;">
                <h3>⬆️ 升级会员等级</h3>
                <div class="tier-grid" id="upgradeGrid"></div>
            </div>
        </div>
    </div>
</div>

<script>
    var csrfToken = null;
    var csrfTokenLastFetch = 0;
    var membershipData = null;
    var isMember = false;
    var currentTier = 'none';
    var allTiers = [];
    var supremeReq = null;

    function getCsrfTokenFromCookie() {
        try {
            var c = document.cookie.split(';');
            for (var i = 0; i < c.length; i++) {
                var cookie = c[i].trim();
                if (cookie.indexOf('csrf_token=') === 0) {
                    return cookie.substring('csrf_token='.length, cookie.length);
                }
            }
        } catch (e) {}
        return null;
    }

    function setCsrfTokenCookie(token) {
        try {
            var expires = new Date(Date.now() + 300000).toUTCString();
            document.cookie = 'csrf_token=' + token + '; expires=' + expires + '; path=/; SameSite=Strict; Secure';
        } catch (e) {}
    }

    async function fetchCsrfToken() {
        if (csrfToken && (Date.now() - csrfTokenLastFetch) < 300000) return csrfToken;
        var cookieToken = getCsrfTokenFromCookie();
        if (cookieToken) {
            csrfToken = cookieToken;
            csrfTokenLastFetch = Date.now();
            return csrfToken;
        }
        try {
            var res = await fetch('/api/csrf-token', {
                method: 'GET',
                credentials: 'include',
                headers: { 'Accept': 'application/json' }
            });
            var data = await res.json();
            if (data.csrf_token) {
                csrfToken = data.csrf_token;
                csrfTokenLastFetch = Date.now();
                setCsrfTokenCookie(csrfToken);
                return csrfToken;
            }
            throw new Error('No CSRF token');
        } catch (e) {
            throw new Error('Failed to fetch CSRF token');
        }
    }

    async function apiRequest(url, options) {
        if (!options) options = {};
        options.credentials = 'include';
        if (!options.headers) options.headers = {};
        options.headers['Content-Type'] = 'application/json';
        options.headers['Accept'] = 'application/json';
        var method = (options.method || 'GET').toUpperCase();
        if (method === 'GET' || method === 'HEAD') {
            var res = await fetch(url, options);
            var data = await res.json();
            if (!res.ok) throw new Error(data.error || '请求失败: ' + res.status);
            return data;
        }
        var token = await fetchCsrfToken();
        options.headers['X-CSRF-Token'] = token;
        var res = await fetch(url, options);
        var data = await res.json();
        if (!res.ok) {
            if (res.status === 403 && data.error && data.error.indexOf('CSRF') !== -1) {
                csrfToken = null;
                var newToken = await fetchCsrfToken();
                options.headers['X-CSRF-Token'] = newToken;
                var retryRes = await fetch(url, options);
                var retryData = await retryRes.json();
                if (!retryRes.ok) throw new Error(retryData.error || '请求失败: ' + retryRes.status);
                return retryData;
            }
            throw new Error(data.error || '请求失败: ' + res.status);
        }
        return data;
    }

    function showMessage(msg, type) {
        var d = document.createElement('div');
        d.className = 'message message-' + type;
        var icon = type === 'success' ? '✅' : type === 'error' ? '❌' : '⚠️';
        d.innerHTML = icon + ' ' + msg;
        document.body.appendChild(d);
        setTimeout(function() { d.remove(); }, 3500);
    }

    function escapeHtml(t) {
        if (!t) return '';
        var d = document.createElement('div');
        d.textContent = t;
        return d.innerHTML;
    }

    var tierIcons = { 'normal': '👑', 'gold': '🥇', 'diamond': '💎', 'supreme': '👑' };
    var tierClasses = { 'normal': 'normal', 'gold': 'gold', 'diamond': 'diamond', 'supreme': 'supreme' };
    var tierBtnClasses = { 'normal': 'buy-normal', 'gold': 'buy-gold', 'diamond': 'buy-diamond', 'supreme': 'buy-supreme' };
    var tierOrder = { 'none': 0, 'normal': 1, 'gold': 2, 'diamond': 3, 'supreme': 4 };

    async function loadTiers() {
        try {
            var data = await apiRequest('/api/membership/tiers');
            allTiers = data.tiers || [];
        } catch (e) {
            console.error('Load tiers error:', e);
        }
    }

    async function loadSupremeRequirements() {
        try {
            supremeReq = await apiRequest('/api/membership/supreme-requirements');
        } catch (e) {
            supremeReq = null;
        }
    }

    function renderTierCard(tier, isCurrent, isUpgrade) {
        var icon = tierIcons[tier.id] || '👑';
        var cls = tierClasses[tier.id] || 'normal';
        var btnCls = tierBtnClasses[tier.id] || 'buy-normal';
        var exclusiveNames = [];
        var gameNames = { 'lucky_wheel': '幸运转盘', 'memory_cards': '记忆翻牌' };
        (tier.exclusive_games || []).forEach(function(g) {
            exclusiveNames.push(gameNames[g] || g);
        });
        var cardCls = 'tier-card ' + cls;
        if (isCurrent) cardCls += ' current';
        var html = '<div class="' + cardCls + '">';
        if (isCurrent) html += '<div class="current-badge">当前等级</div>';
        if (tier.id === 'gold' && !isCurrent) html += '<div class="popular-badge">🔥 最受欢迎</div>';
        if (tier.id === 'supreme' && !isCurrent) html += '<div class="supreme-badge">👑 至尊荣耀</div>';
        html += '<span class="crown">' + icon + '</span>';
        html += '<div class="tier-name">' + escapeHtml(tier.name) + '</div>';
        html += '<div class="tier-subtitle">' + (tier.id === 'normal' ? '入门首选' : tier.id === 'gold' ? '进阶玩家必备' : tier.id === 'diamond' ? '顶级尊享体验' : '至高无上荣耀') + '</div>';
        html += '<div class="tier-price">' + tier.price + ' <small>积分</small></div>';
        html += '<div class="tier-perks">';
        html += '<div class="tier-perk"><span class="icon">🎯</span> 每日游戏次数 <strong>' + tier.max_plays + '次</strong></div>';
        html += '<div class="tier-perk highlight"><span class="icon">⭐</span> 获胜积分 <strong>+' + tier.bonus_rate + '%</strong> 加成</div>';
        html += '<div class="tier-perk"><span class="icon">♾️</span> 永久有效，无需续费</div>';
        if (tier.daily_task_bonus > 0) {
            html += '<div class="tier-perk highlight"><span class="icon">📋</span> 每日任务额外 <strong>+' + tier.daily_task_bonus + '积分</strong></div>';
        }
        if (exclusiveNames.length > 0) {
            html += '<div class="tier-perk highlight"><span class="icon">🎮</span> 专属游戏: <strong>' + exclusiveNames.join('、') + '</strong></div>';
        }
        html += '<div class="tier-perk"><span class="icon">🏆</span> 专属' + tier.name + '标识</div>';
        html += '</div>';
        if (tier.id === 'supreme' && supremeReq) {
            html += '<div class="req-box">';
            html += '<div class="req-title">📋 购买条件</div>';
            html += '<div class="req-item ' + (supremeReq.plays_met ? 'met' : 'not-met') + '">';
            html += '<span>总局数</span><span>' + supremeReq.total_plays + ' / ' + supremeReq.required_plays + (supremeReq.plays_met ? ' ✅' : ' ❌') + '</span>';
            html += '</div>';
            html += '<div class="req-item ' + (supremeReq.win_rate_met ? 'met' : 'not-met') + '">';
            html += '<span>胜率</span><span>' + supremeReq.win_rate + '% / &gt;' + supremeReq.required_win_rate + '%' + (supremeReq.win_rate_met ? ' ✅' : ' ❌') + '</span>';
            html += '</div>';
            html += '</div>';
        }
        if (isCurrent) {
            html += '<button class="tier-btn current-btn" disabled>✅ 当前等级</button>';
        } else if (isUpgrade) {
            var diff = tier.price - getTierPrice(currentTier);
            html += '<button class="tier-btn upgrade" onclick="upgradeTo(\'' + tier.id + '\', ' + diff + ')">⬆️ 升级 (补' + diff.toFixed(2) + '积分)</button>';
        } else {
            var canBuy = true;
            if (tier.id === 'supreme' && supremeReq && !supremeReq.meets_requirements) {
                canBuy = false;
            }
            if (canBuy) {
                html += '<button class="tier-btn ' + btnCls + '" onclick="buyTier(\'' + tier.id + '\', ' + tier.price + ')">👑 立即开通</button>';
            } else {
                html += '<button class="tier-btn ' + btnCls + '" disabled>❌ 未满足条件</button>';
            }
        }
        html += '</div>';
        return html;
    }

    function getTierPrice(tierId) {
        for (var i = 0; i < allTiers.length; i++) {
            if (allTiers[i].id === tierId) return allTiers[i].price;
        }
        return 0;
    }

    async function loadMembershipStatus() {
        try {
            var data = await apiRequest('/api/membership/status');
            membershipData = data;
            isMember = data.is_member || false;
            currentTier = data.tier || 'none';

            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';

            var statusEl = document.getElementById('membershipStatus');
            if (isMember) {
                statusEl.textContent = '✅ ' + data.tier_name;
                statusEl.className = 'value gold';
                if (currentTier === 'supreme') statusEl.className = 'value pink';
                else if (currentTier === 'diamond') statusEl.className = 'value purple';
            } else {
                statusEl.textContent = '❌ 未开通';
                statusEl.className = 'value';
            }

            var maxPlays = data.max_plays || 5;
            var todayPlays = data.today_plays || 0;
            document.getElementById('dailyPlays').textContent = todayPlays + ' / ' + maxPlays;

            var bonusRate = data.bonus_rate || 0;
            var bonusEl = document.getElementById('bonusRate');
            bonusEl.textContent = '+' + bonusRate + '%';
            if (bonusRate > 0) {
                bonusEl.className = 'value green';
            } else {
                bonusEl.className = 'value';
            }

            var tierEl = document.getElementById('tierName');
            tierEl.textContent = data.tier_name || '普通用户';
            if (currentTier === 'supreme') tierEl.className = 'value pink';
            else if (currentTier === 'diamond') tierEl.className = 'value purple';
            else if (currentTier === 'gold' || currentTier === 'normal') tierEl.className = 'value gold';
            else tierEl.className = 'value';

            if (isMember) {
                document.getElementById('notMemberSection').style.display = 'none';
                document.getElementById('memberSection').style.display = 'block';
                renderActiveCard(data);
                renderUpgradeSection();
            } else {
                document.getElementById('notMemberSection').style.display = 'block';
                document.getElementById('memberSection').style.display = 'none';
                renderAllTiers();
            }

        } catch (e) {
            document.getElementById('loadingState').innerHTML = '<div class="loading">加载失败: ' + escapeHtml(e.message) + '</div>';
            showMessage('加载会员状态失败: ' + e.message, 'error');
        }
    }

    function renderAllTiers() {
        var grid = document.getElementById('tierGrid');
        var html = '';
        allTiers.forEach(function(t) {
            html += renderTierCard(t, false, false);
        });
        grid.innerHTML = html;
    }

    function renderActiveCard(data) {
        var icon = tierIcons[currentTier] || '👑';
        document.getElementById('activeCrown').textContent = icon;
        document.getElementById('activeTitle').textContent = data.tier_name + '已激活';
        document.getElementById('activeSubtitle').textContent = '您已享受全部会员权益';
        var activeCard = document.getElementById('activeCard');
        if (currentTier === 'supreme') {
            activeCard.className = 'active-card supreme-active';
        } else {
            activeCard.className = 'active-card';
        }
        var perks = '<div class="perk-active"><span class="icon">🎯</span> 每日游戏次数 <strong>' + data.max_plays + '次</strong>（已生效）</div>';
        perks += '<div class="perk-active"><span class="icon">⭐</span> 获胜积分 <strong>+' + data.bonus_rate + '%</strong> 加成（已生效）</div>';
        perks += '<div class="perk-active"><span class="icon">♾️</span> 永久有效，无需续费</div>';
        if (data.daily_task_bonus > 0) {
            perks += '<div class="perk-active"><span class="icon">📋</span> 每日任务额外 <strong>+' + data.daily_task_bonus + '积分</strong>（已生效）</div>';
        }
        if (data.exclusive_games && data.exclusive_games.length > 0) {
            var gameNames = { 'lucky_wheel': '幸运转盘', 'memory_cards': '记忆翻牌' };
            var names = data.exclusive_games.map(function(g) { return gameNames[g] || g; });
            perks += '<div class="perk-active"><span class="icon">🎮</span> 专属游戏: <strong>' + names.join('、') + '</strong>（已解锁）</div>';
        }
        perks += '<div class="perk-active"><span class="icon">🏆</span> 专属' + data.tier_name + '标识（已激活）</div>';
        document.getElementById('activePerks').innerHTML = perks;
        document.getElementById('activeBadge').textContent = '✅ ' + data.tier_name + '已激活';
    }

    function renderUpgradeSection() {
        var higherTiers = allTiers.filter(function(t) {
            return tierOrder[t.id] > tierOrder[currentTier];
        });
        if (higherTiers.length === 0) {
            document.getElementById('upgradeSection').style.display = 'none';
            return;
        }
        document.getElementById('upgradeSection').style.display = 'block';
        var grid = document.getElementById('upgradeGrid');
        var html = '';
        higherTiers.forEach(function(t) {
            html += renderTierCard(t, false, true);
        });
        grid.innerHTML = html;
    }

    async function buyTier(tierId, price) {
        if (!confirm('确定要花费 ' + price + ' 积分开通此会员吗？')) return;
        var btns = document.querySelectorAll('.tier-btn');
        btns.forEach(function(b) { b.disabled = true; });
        try {
            var data = await apiRequest('/api/membership/buy', {
                method: 'POST',
                body: JSON.stringify({ tier: tierId })
            });
            if (data.success) {
                showMessage('🎉 ' + data.message, 'success');
                isMember = true;
                currentTier = tierId;
                await loadSupremeRequirements();
                await loadMembershipStatus();
            } else {
                showMessage(data.error || '购买失败', 'error');
            }
        } catch (e) {
            showMessage(e.message || '购买失败', 'error');
        } finally {
            btns.forEach(function(b) { b.disabled = false; });
        }
    }

    async function upgradeTo(tierId, diff) {
        if (!confirm('确定要花费 ' + diff.toFixed(2) + ' 积分升级到此等级吗？')) return;
        var btns = document.querySelectorAll('.tier-btn');
        btns.forEach(function(b) { b.disabled = true; });
        try {
            var data = await apiRequest('/api/membership/upgrade', {
                method: 'POST',
                body: JSON.stringify({ tier: tierId })
            });
            if (data.success) {
                showMessage('🎉 ' + data.message, 'success');
                currentTier = tierId;
                await loadSupremeRequirements();
                await loadMembershipStatus();
            } else {
                showMessage(data.error || '升级失败', 'error');
            }
        } catch (e) {
            showMessage(e.message || '升级失败', 'error');
        } finally {
            btns.forEach(function(b) { b.disabled = false; });
        }
    }

    document.addEventListener('DOMContentLoaded', async function() {
        await loadTiers();
        await loadSupremeRequirements();
        await loadMembershipStatus();
    });
</script>
</body>
</html>
